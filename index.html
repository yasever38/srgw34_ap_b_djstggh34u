/* ---------- бегущая строка ---------- */
function setupMarquees(root){
  root.querySelectorAll(".marquee").forEach(el=>{
    const track = el.querySelector(".marquee-track");
    const first = track.querySelector("span");
    el.classList.remove("scrolling"); el.classList.add("static");
    track.style.animationDuration = "";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const overflow = first.scrollWidth > el.clientWidth + 1;
      if(overflow){
        el.classList.remove("static"); el.classList.add("scrolling");
        const dist = first.scrollWidth + 28;
        const duration = Math.max(6, dist/40);
        track.style.animationDuration = duration + "s";
      }
    }));
  });
}

/* ================= ОБРАБОТЧИКИ ================= */
function bindEvents(){
  // --- Выбор месяца/года на главной (временный, не сохраняется в LocalStorage) ---
  document.getElementById("selMonth")?.addEventListener("change", e=>{
    selMonth = parseInt(e.target.value, 10) || null;
    selIncomeChoice = null; // при смене месяца сбрасываем выбор конкретного пополнения
    render();
  });
  document.getElementById("selYear")?.addEventListener("change", e=>{
    selYear = parseInt(e.target.value, 10) || null;
    selIncomeChoice = null;
    render();
  });
  document.getElementById("selIncomeEntry")?.addEventListener("change", e=>{
    selIncomeChoice = e.target.value;
    render();
  });

  // --- Перейти к добавлению дохода ---
  document.getElementById("goAddIncome")?.addEventListener("click", ()=>{
    setActiveView("incomes");
    setTimeout(()=>document.getElementById("newAmount")?.focus(), 50);
  });

  // --- Доходы: добавление ---
  document.getElementById("addIncomeBtn")?.addEventListener("click", ()=>{
    const date = document.getElementById("newDate").value;
    const rawAmount = parseFloat(document.getElementById("newAmount").value);
    const comment = document.getElementById("newComment").value.trim();
    if(!date || !isIsoDate(date)){ toast("Укажите дату дохода.", "warn"); return; }
    if(isNaN(rawAmount) || !isFinite(rawAmount)){ toast("Укажите сумму дохода.", "warn"); return; }
    if(rawAmount <= 0){ toast("Сумма дохода должна быть больше 0 ₽.", "warn"); return; }
    const amount = round2(rawAmount);
    state.incomes.push({id: freshUid(), date, amount, comment});
    // На главной сразу показываем месяц нового дохода
    const d = new Date(date + "T00:00:00");
    if(!isNaN(d)){ selMonth = d.getMonth()+1; selYear = d.getFullYear(); selIncomeChoice = null; }
    if(save()) toast(`Доход ${fmt(amount)} от ${ruDate(date)} добавлен.`, "ok");
  });
  // Enter в любом поле формы — то же, что кнопка «Добавить»
  ["newDate", "newAmount", "newComment"].forEach(id => {
    document.getElementById(id)?.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); document.getElementById("addIncomeBtn")?.click(); }
    });
  });
  document.querySelectorAll("[data-del-income]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const i = state.incomes.find(x => x.id === el.dataset.delIncome);
      if(!i) return;
      confirmDialog({
        title: "Удалить доход?",
        html: `<b>${esc(ruDate(i.date || ""))} — ${fmt(i.amount)}</b>${i.comment ? `<br>${esc(i.comment)}` : ""}<br><br>Распределение этого месяца пересчитается. Отменить удаление будет нельзя.`,
        okText: "Удалить",
      }, () => {
        // Удаляем по id — на случай, если список успел измениться
        const at = state.incomes.findIndex(x => x.id === i.id);
        if(at === -1) return;
        state.incomes.splice(at, 1);
        if(save()) toast(`Доход ${fmt(i.amount)} от ${ruDate(i.date)} удалён.`, "ok");
      });
    });
  });

  // --- Настройки: закрыть предупреждение о долгах (больше не показывается) ---
  document.querySelector("[data-close-debt]")?.addEventListener("click", ()=>{
    state.hideDebtNotice = true;
    save();
  });

  // --- Настройки: цель на месяц ---
  document.getElementById("goalInput")?.addEventListener("change", e=>{
    const v = parseFloat(e.target.value);
    // Пустое поле/мусор/меньше минимума — не меняем цель молча, а возвращаем прежнюю.
    if(e.target.value.trim() === "" || isNaN(v) || !isFinite(v)){ toast("Введите цель на месяц — сумму в рублях.", "warn"); render(); return; }
    if(v < MIN_GOAL){ toast(`Цель на месяц — не меньше ${fmt(MIN_GOAL)}.`, "warn"); render(); return; }
    state.monthGoal = round2(v);
    save();
  });

  // --- Настройки: переключение тип/значение категории ---
  document.querySelectorAll("[data-seg]").forEach(seg=>{
    seg.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const uid = seg.dataset.seg;
        const kind = btn.dataset.segKind;
        const hit = findNode(state.tree, uid);
        if(!hit) return;
        const nd = hit.node;
        // при переключении типа берём текущее «значение» за основу
        if(kind === "pct" && nd.kind !== "pct"){
          const parent = findParentOf(state.tree, uid);
          // % от основы своего уровня (план на цель), а не от всего дохода
          const newVal = (parent && n2(parent.amount) > 0) ? (round2(n2(nd.amount) / n2(parent.amount) * 10000) / 100 || 1) : 1;
          tryTreeChange(uid, t => { const n = findNode(t, uid).node; n.kind = "pct"; n.value = newVal; });
        }
        if(kind === "fixed" && nd.kind !== "fixed"){
          const newVal = round2(n2(nd.amount));
          tryTreeChange(uid, t => { const n = findNode(t, uid).node; n.kind = "fixed"; n.value = newVal; });
        }
      });
    });
  });

  // --- Настройки: изменение значения ---
  document.querySelectorAll("[data-set-value]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const uid = inp.dataset.setValue;
      const hit = findNode(state.tree, uid);
      if(!hit) return;
      const v = parseFloat(inp.value);
      const val = isNaN(v)?0:Math.max(0,v);
      const kind = inp.dataset.kind === "pct" ? "pct" : "fixed";
      tryTreeChange(uid, t => { const n = findNode(t, uid).node; n.kind = kind; n.value = val; });
    });
  });

  // --- Настройки: добавление пользовательской категории ---
  // Плейсхолдер поля «Значение» зависит от выбранного типа
  document.getElementById("customType")?.addEventListener("change", e=>{
    const v = document.getElementById("customValue");
    if(v) v.placeholder = e.target.value === "fixed" ? "Сумма, ₽" : "Процент";
  });
  document.getElementById("addCustomBtn")?.addEventListener("click", ()=>{
    const name = document.getElementById("customName").value.trim();
    const levelId = document.getElementById("customLevel").value;
    const type = document.getElementById("customType").value;
    const val = parseFloat(document.getElementById("customValue").value);
    if(!name || isNaN(val)){ toast(!name ? "Укажите название категории." : "Укажите значение категории.", "warn"); return; }
    const { parent } = containerByLevel(levelId);
    const uid = freshUid();
    const node = { uid, kind: type==="pct"?"pct":"fixed", value: Math.max(0,val), name, custom: true };
    tryTreeChange(uid, t => {
      const hit = findNode(t, parent.uid);
      insertCategoryChild(hit ? hit.node : t, node);
    }, () => { customDraft = { name, level: levelId, type, val: Math.max(0, val) }; });
  });

  // Enter в полях новой категории — то же, что кнопка «Добавить категорию»
  ["customName", "customValue"].forEach(id => {
    document.getElementById(id)?.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); document.getElementById("addCustomBtn")?.click(); }
    });
  });

  // --- Настройки: удаление пользовательской категории ---
  document.querySelectorAll("[data-del-custom]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const uid = el.dataset.delCustom;
      const hit = findNode(state.tree, uid);
      if(!hit) return;
      const nd = hit.node;
      confirmDialog({
        title: "Удалить категорию?",
        html: `<b>${esc(nd.name)}</b> — ${nd.kind === "pct" ? pctFmt(nd.value) : fmt(nd.value)}<br><br>Её доля перейдёт другим категориям уровня, распределение пересчитается. Отменить удаление будет нельзя.`,
        okText: "Удалить",
      }, () => {
        const parent = findParentOf(state.tree, uid);
        if(!parent) return;
        parent.children = parent.children.filter(c=>c.uid !== uid);
        if(save()) toast(`Категория «${nd.name}» удалена.`, "ok");
      });
    });
  });

  // --- Настройки: смена уровня пользовательской категории ---
  document.querySelectorAll("[data-custom-level]").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const uid = sel.dataset.customLevel;
      const levelId = sel.value;
      const parent = findParentOf(state.tree, uid);
      if(!parent) return;
      const { parent: newParent } = containerByLevel(levelId);
      if(newParent === parent) return;
      tryTreeChange(uid, t => {
        const from = findParentOf(t, uid);
        const idx = from.children.findIndex(c=>c.uid === uid);
        const nd = from.children.splice(idx,1)[0];
        const to = findNode(t, newParent.uid);
        insertCategoryChild(to ? to.node : t, nd);
      });
    });
  });

  // --- Настройки: переименование категории ---
  document.querySelectorAll("[data-edit-name]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uid = btn.dataset.editName;
      const hit = findNode(state.tree, uid);
      if(!hit) return;
      const nameTxt = btn.parentElement.querySelector(".marquee");
      if(!nameTxt) return;
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "cat-name-inp";
      inp.value = hit.node.name;
      nameTxt.replaceWith(inp);
      btn.remove();
      inp.focus();
      inp.select();
      // done — onDone срабатывает один раз: после Esc render() убирает поле,
      // и браузер присылает blur, который иначе сохранил бы введённое имя.
      let done = false;
      const onDone = (commit)=>{
        if(done) return;
        done = true;
        const v = (inp.value||"").trim();
        if(commit && v && v !== hit.node.name){ hit.node.name = v; save(); }
        else { render(); }
      };
      inp.addEventListener("blur", ()=>onDone(true));
      inp.addEventListener("keydown", (e)=>{
        if(e.key === "Enter"){ inp.blur(); }
        if(e.key === "Escape"){ e.preventDefault(); onDone(false); }
      });
    });
  });

  // --- Настройки: экспорт / импорт ---
  bindBackupEvents();

  // --- Информация: сворачивание лет в долгосроке ---
  document.querySelectorAll("[data-year-toggle]").forEach(h=>{
    h.addEventListener("click", ()=>{
      const body = h.parentElement.querySelector(".year-body");
      body.classList.toggle("hidden");
    });
  });

  // --- Информация: отметки «Сделано» в календаре ---
  document.querySelectorAll("[data-cal-check]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      state.calCheck[cb.dataset.calCheck] = cb.checked ? true : false;
      save();
    });
  });
}

// Экспорт/импорт — отдельно от bindEvents(): нужны и на аварийном экране
// (renderCrash()), когда обычная отрисовка не удалась.
function bindBackupEvents(){
  document.getElementById("exportBtn")?.addEventListener("click", ()=>{
    const dataStr = JSON.stringify(snapState(), null, 2);
    const blob = new Blob([dataStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `budget-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  document.getElementById("importBtn")?.addEventListener("click", ()=>{
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile")?.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      // Сначала полностью проверяем файл на копии — текущие данные не
      // трогаются, пока пользователь не подтвердит замену.
      let res;
      try{
        res = normalizeState(JSON.parse(reader.result));
        migrateCalCheck(res.st);
      }catch(err){
        toast("Не удалось импортировать: " + (err instanceof SyntaxError ? "файл повреждён или это не JSON." : err.message), "err");
        return;
      }
      const next = res.st;
      const cats = st => flatten(st.tree).filter(n => n.kind === "pct" || n.kind === "fixed").length;
      const curInc = Array.isArray(state.incomes) ? state.incomes.length : 0;
      confirmDialog({
        title: "Заменить все данные?",
        html: `Сейчас: <b>${curInc}</b> ${plural(curInc, "доход", "дохода", "доходов")}, <b>${cats(state)}</b> ${plural(cats(state), "категория", "категории", "категорий")}.<br>
               В файле: <b>${next.incomes.length}</b> ${plural(next.incomes.length, "доход", "дохода", "доходов")}, <b>${cats(next)}</b> ${plural(cats(next), "категория", "категории", "категорий")}.<br><br>
               Текущие данные будут полностью заменены. Если они могут понадобиться — сначала сделайте «Экспорт JSON».`,
        okText: "Заменить",
      }, () => {
        state = next;
        selMonth = null; selYear = null; selIncomeChoice = null;
        if(!save()) return;
        if(res.fixes.length) toast("Импортировано с исправлениями: " + res.fixes.join("; ") + ".", "warn");
        else toast("Данные восстановлены из файла.", "ok");
      });
    };
    reader.onerror = () => toast("Не удалось прочитать файл.", "err");
    reader.readAsText(file);
    e.target.value = "";
  });
}

// Склонение: plural(5, "доход", "дохода", "доходов") → «доходов».
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b === 1) return one;
  if(b >= 2 && b <= 4) return few;
  return many;
}

/* ---------- навигация по табам ---------- */
document.querySelectorAll("nav.tabbar button").forEach(btn=>{
  btn.addEventListener("click", ()=> setActiveView(btn.dataset.view));
});

window.addEventListener("resize", ()=>{
  const view = document.querySelector("main .view.active");
  if(view) setupMarquees(view);
  if(activeView === "home") drawChart();
});

document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && activeView === "home") drawChart();
});

/* ================= PWA: установка + Service Worker ================= */
let deferredPrompt = null;
const A2HS_KEY = "budget_a2hs_dismissed";

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!localStorage.getItem(A2HS_KEY)) showA2hs();
});
function showA2hs(){ document.getElementById("a2hs").classList.remove("hidden"); }
function hideA2hs(){ document.getElementById("a2hs").classList.add("hidden"); }

document.getElementById("a2hsInstall").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});
document.getElementById("a2hsClose").addEventListener("click", ()=>{
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});

window.addEventListener("appinstalled", ()=>{
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});

// регистрация Service Worker
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

/* ---------- стиль для скрытых элементов ---------- */
const style = document.createElement("style");
style.textContent = ".hidden{display:none !important;}";
document.head.appendChild(style);

/* ---------- старт ---------- */
if(persistAfterLoad){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(snapState())); }catch(e){}
}
render();
loadNotices.forEach(n => toast(n.msg, n.type));
</script>
