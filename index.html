<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="theme-color" content="#0F2647">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Бюджет</title>
<!-- График — Chart.js через CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* ==== ТОЧНОЕ ОФОРМЛЕНИЕ ТЕКУЩЕЙ ВЕРСИИ (без изменений) ==== */
  :root{
    --navy-deep:#0B1D33;
    --navy:#13294B;
    --navy-card:#16315A;
    --line:#274571;
    --gold:#D4AF6A;
    --mint:#5FC9B6;
    --coral:#E08D6E;
    --sage:#8FAE9B;
    --text:#EDEFF3;
    --text-dim:#9AAAC4;
    --danger:#E05C5C;
    --good:#5FC97A;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--navy-deep); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    overscroll-behavior-y:none; height:100%; overflow-x:hidden;}
  body{display:flex; flex-direction:column; height:100vh; width:100%; max-width:100%;}
  .topbar{
    padding-top:calc(env(safe-area-inset-top,0px) + 16px);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px 18px;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{margin:0; font-size:20px; font-weight:700; letter-spacing:.2px;}
  .topbar .sub{font-size:12.5px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  main{flex:1; overflow-y:auto; overflow-x:hidden; min-width:0; width:100%; padding:14px 14px calc(86px + env(safe-area-inset-bottom,0px)) 14px;}
  .card{
    background:var(--navy-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .card h2{margin:0 0 10px 0; font-size:14.5px; font-weight:700; color:var(--gold); letter-spacing:.3px;
    text-transform:uppercase;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,0.05); gap:10px;}
  .row:last-child{border-bottom:none;}
  .row .label{font-size:14px; color:var(--text-dim); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .value{font-size:15.5px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .value.neg{color:var(--danger);}
  .value.pos{color:var(--good);}
  .big-stat{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
  .big-stat .num{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
  .big-stat .cap{font-size:12px; color:var(--text-dim);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mini{background:var(--navy); border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0;}
  .mini .num{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; word-break:break-word;}
  .mini .cap{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  input[type=text], input[type=number], input[type=date]{
    background:var(--navy); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:15px; width:100%;
    font-family:inherit;
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  input[disabled]{opacity:.55;}
  .pct-input{width:74px !important; text-align:right; flex:0 0 74px !important;}
  label.field{display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--gold); color:#1A1404; font-weight:700; font-size:14.5px;
    border:none; border-radius:12px; padding:12px 16px; width:100%;
    cursor:pointer; -webkit-appearance:none;
  }
  .btn.secondary{background:transparent; color:var(--gold); border:1px solid var(--gold);}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}

  .cat-row{display:flex; flex-direction:column; gap:7px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .title-row{width:100%; min-width:0;}
  .cat-row .meta-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .cat-row .meta-left{flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cat-row .meta-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .cat-row .comment{font-size:11px; color:var(--text-dim); line-height:1.35;}
  .cat-row .amount{font-size:13px; color:var(--mint); font-weight:700; min-width:74px; text-align:right; flex:0 0 auto;}

  /* --- бегущая строка для длинных названий --- */
  .marquee{ overflow:hidden; white-space:nowrap; position:relative; flex:1 1 auto; min-width:0; width:100%; }
  .marquee-track{ display:inline-flex; will-change:transform; min-width:100%; }
  .marquee-track > span{ display:inline-block; white-space:nowrap; padding-right:28px; font-size:14.5px; font-weight:600;}
  .marquee.static .marquee-track{ transform:none !important; animation:none !important; }
  .marquee.static .marquee-track > span:nth-child(2){ display:none; }
  @keyframes marquee-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .marquee.scrolling .marquee-track{ animation:marquee-scroll linear infinite; }

  /* Размер текста бегущей строки в разных местах */
  .tree-line .tname .marquee-track > span{font-size:13.5px; font-weight:600;}
  .tree-line.container .tname .marquee-track > span{font-size:13.5px; font-weight:800;}
  .cat-name .marquee-track > span{font-size:13px; font-weight:600;}
  .set-row .s-name .marquee-track > span{font-size:13.5px; font-weight:600;}
  .income-item .month .marquee-track > span{font-size:14px; font-weight:600; color:var(--text-dim);}
  /* Метки внутри бегущей строки («фикс», «%», «своя») — по центру строки, без своего отступа сверху */
  .marquee .tag{margin-top:0; vertical-align:middle;}
  .marquee .cnt{margin-right:4px;}

  .tag{display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; margin-top:4px;}
  .tag.safe{background:rgba(95,201,182,.15); color:var(--mint);}
  .tag.metal{background:rgba(212,175,106,.15); color:var(--gold);}
  .tag.aggr{background:rgba(224,141,110,.15); color:var(--coral);}
  .tag.gray{background:rgba(154,170,196,.15); color:var(--text-dim);}
  .warn{font-size:12.5px; color:var(--danger); margin-top:8px;}
  .ok{font-size:12.5px; color:var(--good); margin-top:8px;}
  .income-item{display:flex; justify-content:space-between; align-items:center; padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);}
  .income-item:last-child{border-bottom:none;}
  .income-item .month{font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .income-item .amt{font-weight:700; font-variant-numeric:tabular-nums;}
  .income-item .del{color:var(--text-dim); font-size:18px; padding:2px 8px; cursor:pointer;}
  .add-income{display:flex; gap:8px; margin-top:10px;}
  .add-income input{flex:1;}
  .add-income .btn{flex:1; width:auto;}
  .flow{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; color:var(--text-dim);}
  .flow .arrow{color:var(--gold); font-size:16px;}
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--navy); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;
    z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; padding:6px 0; font-family:inherit;
  }
  nav.tabbar button .ic{font-size:19px; line-height:1;}
  nav.tabbar button.active{color:var(--gold);}
  .view{display:none;}
  .view.active{display:block;}
  .empty{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13.5px;}
  .section-note{font-size:12px; color:var(--text-dim); margin:-4px 0 12px 0; line-height:1.5;}
  .check-banner{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; font-size:13px; margin-top:6px;}
  .check-banner.good{background:rgba(95,201,122,.12); color:var(--good);}
  .check-banner.bad{background:rgba(224,92,92,.12); color:var(--danger);}
  .lock-note{font-size:11px; color:var(--text-dim); margin-top:2px;}

  /* ==== ДОБАВЛЕНО ДЛЯ НОВЫХ ЭКРАНОВ ==== */

  /* Кнопка «Добавить доход» — крупная */
  .btn-big{font-size:17px; padding:16px; border-radius:14px;}
  .btn-big .plus{font-size:22px; line-height:1;}

  /* Контейнер графика */
  .chart-wrap{position:relative; width:100%; max-width:360px; margin:8px auto 4px auto;}
  .chart-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center; padding:0 20px;}
  .chart-center .v{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chart-center .c{font-size:11px; color:var(--text-dim);}

  /* Легенда (список распределения) под диаграммой */
  .legend{display:flex; flex-direction:column; gap:6px; margin-top:14px;}
  .legend .lg{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .legend .sw{width:12px; height:12px; border-radius:3px; flex:0 0 auto;}
  .legend .lg .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend .lg .vv{color:var(--text-dim); font-variant-numeric:tabular-nums;}

  /* Иерархия распределения (дерево) */
  .tree-line{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05);}
  .tree-line:last-child{border-bottom:none;}
  .tree-line .tname{flex:1; min-width:0; font-size:13.5px; display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tree-line .tname .cnt{color:var(--mint); font-size:11px; opacity:.9;}
  .tree-line .tamount{font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .tree-line .tamount .pct{font-size:11px; color:var(--text-dim); font-weight:600;}
  .tree-line.container .tname{font-weight:800; color:var(--gold);}
  .tree-line.container .tamount{color:var(--gold);}
  /* Три строки-контейнера («Доход», «Остаток», «Свободный остаток»):
     названия слева, суммы — по центру отведённой колонки */
  .tree-line.tree-line-c .tname{flex:0 0 58%;}
  .tree-line.tree-line-c .tamount{flex:1; text-align:center;}
  .indent-0{padding-left:0;} .indent-1{padding-left:16px;} .indent-2{padding-left:32px;} .indent-3{padding-left:48px;}

  /* Настройки: ползунки и ряды категорий */
  .set-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); flex-wrap:wrap;}
  .set-row:last-child{border-bottom:none;}
  .set-row .s-name{flex:1; min-width:140px; font-size:13.5px;}
  .set-row .s-name small{display:block; color:var(--text-dim); font-size:11px; font-weight:400;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:0 0 auto;}
  .seg button{background:none; border:none; color:var(--text-dim); padding:7px 12px; font-size:12px; font-family:inherit; cursor:pointer;}
  .seg button.active{background:var(--gold); color:#1A1404; font-weight:700;}

  /* Добавить категорию */
  .form-field{margin-bottom:10px;}
  .form-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .form-grid > *{flex:1; min-width:120px;}

  /* Информация */
  .info-section-title{font-size:14px; font-weight:800; color:var(--gold); text-transform:none; letter-spacing:.2px;}
  .kv{display:flex; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; line-height:1.45;}
  .kv:last-child{border-bottom:none;}
  .kv .k{flex:0 0 118px; color:var(--gold); font-weight:700; font-size:12.5px;}
  .kv .v{flex:1; color:var(--text); min-width:0;}
  .kv.tight .k{flex-basis:92px;}
  .nl{list-style:none; margin:0; padding:0;}
  .nl li{display:flex; gap:8px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; line-height:1.45;}
  .nl li:last-child{border-bottom:none;}
  .nl .n{color:var(--gold); font-weight:700; flex:0 0 18px; text-align:right;}

  /* Календарь действий */
  .cal-group{padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.08);}
  .cal-group:last-child{border-bottom:none;}
  .cal-date{font-size:12px; color:var(--mint); font-weight:700; display:block; margin-bottom:3px;}
  .cal-type{display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px; margin-bottom:5px; font-weight:700;}
  .cal-type.podg{background:rgba(154,170,196,.15); color:var(--text-dim);}
  .cal-type.year{background:rgba(95,201,182,.15); color:var(--mint);}
  .cal-type.key{background:rgba(212,175,106,.18); color:var(--gold);}
  .cal-item + .cal-item{margin-top:12px;}
  .cal-check{display:flex; align-items:flex-start; gap:10px; margin-top:6px;}
  .cal-check input{width:auto; margin-top:2px; flex:0 0 auto;}
  .cal-body{flex:1;}
  .cal-body .w{font-size:13.5px; font-weight:600; margin-bottom:2px;}
  .cal-body .d{font-size:12px; color:var(--text-dim); line-height:1.4;}
  .cal-check.done .cal-body{opacity:.45;}
  .cal-check.done .w{text-decoration:line-through;}

  /* Долгосрок */
  .year-head{display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:none;
    color:var(--gold); font-family:inherit; font-size:14px; font-weight:800; padding:10px 0; cursor:pointer; letter-spacing:.3px;}
  .year-head .sum{color:var(--text-dim); font-size:11.5px; font-weight:600;}
  .lg-grid{display:grid; grid-template-columns:58px 1fr 1fr 1fr 1fr; gap:4px 8px; font-size:11.5px; padding:4px 0;}
  .lg-grid .hd{color:var(--gold); font-weight:700; font-size:10.5px;}
  .lg-grid .rv{font-variant-numeric:tabular-nums; color:var(--text-dim);}
  .lg-grid .rv.p{color:var(--mint);}
  .lg-grid .rv.i{color:var(--gold);}
  .lg-grid .note{grid-column:1 / -1; color:var(--text-dim); font-size:10.5px; padding-top:2px;}

  /* Подсказка установки PWA */
  .a2hs{position:fixed; left:10px; right:10px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:9;
    background:var(--navy-card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px; box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .a2hs .txt{flex:1; font-size:12.5px; line-height:1.35;}
  .a2hs button{background:none; border:none; color:var(--gold); font-weight:700; font-size:12px; font-family:inherit; cursor:pointer; padding:4px 6px;}
  .a2hs button.x{color:var(--text-dim); font-size:16px;}
  .a2hs.hidden{display:none;}

  /* Уведомления (toast): сверху поверх экрана, закрываются ✕, смахиванием вбок или сами */
  .toasts{position:fixed; left:10px; right:10px; top:calc(env(safe-area-inset-top,0px) + 10px); z-index:30;
    display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:520px; margin:0 auto;}
  .toast{pointer-events:auto; display:flex; align-items:flex-start; gap:10px; padding:12px 12px 12px 14px;
    border-radius:14px; font-size:13px; line-height:1.45; box-shadow:0 6px 24px rgba(0,0,0,.45);
    background:var(--navy-card); border:1px solid var(--line); color:var(--text);
    touch-action:pan-y; user-select:none; transition:transform .2s ease, opacity .2s ease;
    animation:toast-in .2s ease;}
  .toast.err{border-color:rgba(255,107,107,.6); background:#3A2234;}
  .toast.warn{border-color:rgba(212,175,106,.6); background:#2E2E3A;}
  .toast.ok{border-color:rgba(95,201,122,.6); background:#1E3A3A;}
  .toast .t-ic{flex:0 0 auto;}
  .toast .t-txt{flex:1; min-width:0;}
  .toast .t-x{flex:0 0 auto; background:none; border:none; color:var(--text-dim); font-size:15px; line-height:1;
    padding:2px 4px; cursor:pointer; font-family:inherit;}
  .toast.dragging{transition:none;}
  @keyframes toast-in{ from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;} }

  /* Окно подтверждения (удаление и т.п.) */
  .modal-back{position:fixed; inset:0; z-index:40; background:rgba(5,12,24,.6);
    display:flex; align-items:flex-end; justify-content:center;
    padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px)); animation:modal-fade .15s ease;}
  .modal{width:100%; max-width:420px; background:var(--navy-card); border:1px solid var(--line);
    border-radius:18px; padding:18px 16px 14px; box-shadow:0 10px 40px rgba(0,0,0,.5); animation:modal-up .18s ease;}
  .modal h3{margin:0 0 8px; font-size:16px; font-weight:800; color:var(--text);}
  .modal .m-txt{font-size:13.5px; color:var(--text-dim); line-height:1.5; margin-bottom:14px;}
  .modal .m-txt b{color:var(--text);}
  .modal .m-btns{display:flex; gap:8px;}
  .modal .m-btns .btn{flex:1;}
  .btn.danger-solid{background:var(--danger); color:#fff;}
  @keyframes modal-fade{ from{opacity:0;} to{opacity:1;} }
  @keyframes modal-up{ from{transform:translateY(20px); opacity:0;} to{transform:none; opacity:1;} }

  /* Баннер «есть долги» */
  .debt-banner{background:rgba(224,92,92,.12); border:1px solid rgba(224,92,92,.4); color:var(--danger);
    border-radius:var(--radius); padding:14px 16px; font-size:13px; line-height:1.45; margin-bottom:12px;}

  /* ===== НОВОЕ: главная (1.1–1.4) ===== */

  /* Селектор месяца/года на главной */
  .period-row{display:flex; gap:8px; margin-top:4px;}
  select.change-level, select.form-select{background:var(--navy); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:9px 10px; font-size:13.5px; font-family:inherit; max-width:100%;}
  select.form-select{width:100%; padding:10px; font-size:14px;}
  .period-select{flex:1; background:var(--navy); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px; font-size:14px; font-family:inherit;}

  /* Три строки-контейнера («Доход», «Остаток», «Свободный остаток») с переключаемым типом */
  .locked-row{background:var(--navy-card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin:0 0 6px 0;}
  .locked-row .k2{font-size:12px; color:var(--text-dim); font-weight:400;}
  .locked-row .v2{font-size:15px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums;}
  .switch2{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:0 0 auto;}
  .switch2 button{background:none; border:none; color:var(--text-dim); padding:6px 10px; font-size:11px; font-family:inherit; cursor:pointer;}
  .switch2 button.active{background:var(--gold); color:#1A1404; font-weight:700;}

  /* ===== НОВОЕ: настройки (3.1–3.4) ===== */

  /* Статичное предупреждение о долгах (вместо чекбокса) */
  .debt-notice{background:rgba(224,92,92,.12); border:1px solid rgba(224,92,92,.4); color:var(--danger);
    border-radius:var(--radius); padding:12px 34px 12px 16px; font-size:13px; line-height:1.45; position:relative;}

<script>
"use strict";
/* =====================================================================
   ЛОГИКА ФИНАНСОВОГО PWA-ПРИЛОЖЕНИЯ «БЮДЖЕТ»
   Иерархическое распределение ЗП; данные — в LocalStorage;
   экспорт/импорт JSON; офлайн через Service Worker.
   ===================================================================== */

const STORAGE_KEY = "budget_app_v4";

/* ---------- состояние по умолчанию ---------- */
function defaultState(){
  return {
    storageVersion: "budget_app_v4",
    hasDebts: false,          // «приложение работает только при отсутствии кредитов и долгов»
    hideDebtNotice: false,    // пользователь закрыл предупреждение о долгах (крестиком) — больше не показываем
    salary: 90000,            // устарело, не используется (оставлено для совместимости старых копий)
    monthGoal: 85000,         // цель дохода на месяц — от неё считается план категорий
    tree: defaultTree(),      // иерархия категорий
    incomes: [],              // история доходов: {id, date, amount, comment}
    calCheck: {},             // отметки «Сделано» в календаре действий (ключ = id записи CALENDAR, см. migrateCalCheck())
    ui: { theme: "dark" },    // настройки UI (в текущем дизайне тема только тёмная)
  };
}

/* Дерево по умолчанию: kind root/base/pct/fixed. base-узел — контейнер:
   есть value → % от родителя, иначе — остаток. */
let uidSeq = 1;
function defaultTree(){
  return {
    uid: "root", kind: "root", name: "Зарплата", custom: false,
    children: [
      { uid: "b1", kind: "pct",   value: 1,     name: "Благотворительность", custom: false },
      { uid: "b2", kind: "fixed", value: 27350, name: "ИИС", custom: false },
      { uid: "b3", kind: "fixed", value: 6000,  name: "ПДС", custom: false },
      { uid: "b4", kind: "base",  value: null,  name: "Остаток", custom: false, children: [
        { uid: "b5", kind: "pct", value: 70, name: "На жизнь", custom: false },
        { uid: "b6", kind: "base", value: null, name: "Свободный остаток", custom: false, children: [
          { uid: "b7", kind: "pct", value: 30, name: "Подушка безопасности", custom: false },
          { uid: "b8", kind: "pct", value: 70, name: "Агрессивные накопления", custom: false },
        ]},
      ]},
    ]
  };
}

/* ---------- загрузка / сохранение в LocalStorage ---------- */

// Старое поле b6.value=30 -> null (контейнер-остаток).
function migrateTree(t){
  if(!t) return;
  const hit = findNode(t, "b6");
  const b6 = hit && hit.node;
  if(b6 && b6.kind === "base" && b6.value === 30) b6.value = null;
}

// Отметки календаря раньше ключевались по "дата|текст" — переносим на
// постоянный id (см. CALENDAR). Вызывается после того, как CALENDAR уже
// построен (не раньше — массив ещё не существует).
function migrateCalCheck(st){
  if(!st || !st.calCheck) return false;
  let changed = false;
  CALENDAR.forEach(item => {
    const oldKey = item.date + "|" + item.what;
    if(st.calCheck[oldKey] && !st.calCheck[item.id]){
      st.calCheck[item.id] = st.calCheck[oldKey];
      changed = true;
    }
  });
  Object.keys(st.calCheck).forEach(k => {
    if(/^\d{4}-\d{2}-\d{2}\|/.test(k)){ delete st.calCheck[k]; changed = true; }
  });
  // Удалённые из календаря пункты — их отметки больше не нужны
  ["prep-cushion-risk"].forEach(k => {
    if(Object.prototype.hasOwnProperty.call(st.calCheck, k)){ delete st.calCheck[k]; changed = true; }
  });
  return changed;
}

// Сообщения о проблемах при загрузке: показываются уведомлением после
// первой отрисовки (во время load() интерфейса ещё нет).
const loadNotices = [];
// true — load() отремонтировал данные и сохранил копию исходных: при старте
// записываем исправленную версию, иначе ремонт, копия и уведомление
// повторялись бы при каждом запуске (см. конец скрипта).
let persistAfterLoad = false;
const MAX_BROKEN_COPIES = 3;

function isIsoDate(v){
  if(typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  return !isNaN(new Date(v + "T00:00:00"));
}

// Проверяет и чинит данные (из LocalStorage или файла импорта) и возвращает
// НОВЫЙ объект состояния — исходный не трогает. Не похоже на данные этого
// приложения → исключение (с понятным текстом). Мелкие повреждения чинятся,
// а список исправлений возвращается в fixes, чтобы честно сообщить о них.
function normalizeState(parsed){
  const notOurs = "Похоже, это не файл резервной копии этого приложения.";
  if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error(notOurs);
  const t = parsed.tree;
  if(!t || typeof t !== "object" || t.kind !== "root") throw new Error(notOurs);
  const fixes = [];
  const st = Object.assign(defaultState(), JSON.parse(JSON.stringify(parsed)));

  // --- дерево категорий ---
  let badNodes = 0, badValues = 0;
  const seen = new Set();
  (function walk(n){
    if(typeof n.uid !== "string" || !n.uid || seen.has(n.uid)) n.uid = n.kind === "root" ? "root" : freshUid();
    seen.add(n.uid);
    if(typeof n.name !== "string" || !n.name.trim()) n.name = n.kind === "root" ? "Зарплата" : "Без названия";
    if(n.kind === "pct" || n.kind === "fixed"){
      const v = Number(n.value);
      if(!isFinite(v) || v < 0 || n.value === null || n.value === ""){ n.value = 0; badValues++; }
      else n.value = v;
      delete n.children;
      return;
    }
    if(n.kind === "base" && n.value != null){
      const v = Number(n.value);
      if(!isFinite(v) || v < 0){ n.value = null; badValues++; } else n.value = v;
    }
    const kids = Array.isArray(n.children) ? n.children : [];
    n.children = kids.filter(ch => {
      const ok = ch && typeof ch === "object" && !Array.isArray(ch) && ["base","pct","fixed"].includes(ch.kind);
      if(!ok) badNodes++;
      return ok;
    });
    n.children.forEach(walk);
  })(st.tree);
  const catCount = flatten(st.tree).filter(n => n.kind === "pct" || n.kind === "fixed").length;
  if(!catCount) throw new Error("В файле нет ни одной категории — это не похоже на резервную копию.");
  if(badNodes) fixes.push(`пропущено повреждённых категорий: ${badNodes}`);
  if(badValues) fixes.push(`некорректных значений категорий заменено на 0: ${badValues}`);

  // --- доходы ---
  if(!Array.isArray(st.incomes)){
    if(parsed.incomes !== undefined) fixes.push("список доходов повреждён и не загружен");
    st.incomes = [];
  }
  let badInc = 0, negInc = 0;
  const ids = new Set();
  st.incomes = st.incomes.filter(i => {
    if(!i || typeof i !== "object" || !isIsoDate(i.date) || !isFinite(Number(i.amount)) || i.amount === null || i.amount === ""){ badInc++; return false; }
    i.amount = Number(i.amount);
    if(i.amount < 0){ i.amount = 0; negInc++; }
    if(typeof i.id !== "string" || !i.id || ids.has(i.id)) i.id = freshUid();
    ids.add(i.id);
    i.comment = typeof i.comment === "string" ? i.comment : "";
    return true;
  });
  if(badInc) fixes.push(`пропущено повреждённых записей о доходах: ${badInc}`);
  if(negInc) fixes.push(`отрицательных сумм доходов заменено на 0: ${negInc}`);

  // --- цель на месяц ---
  const g = Number(st.monthGoal);
  if(st.monthGoal === null || st.monthGoal === "" || !isFinite(g) || g < 0){
    st.monthGoal = 85000;
    fixes.push("цель на месяц была некорректной — установлено 85 000 ₽");
  } else if(g < 1000){
    // Минимум цели — 1 000 ₽ (MIN_GOAL; константа объявлена ниже, здесь — число:
    // normalizeState() вызывается из load() раньше её объявления).
    st.monthGoal = 1000;
    fixes.push("цель на месяц была меньше 1 000 ₽ — установлено 1 000 ₽");
  } else st.monthGoal = g;

  // --- прочее ---
  if(!st.calCheck || typeof st.calCheck !== "object" || Array.isArray(st.calCheck)) st.calCheck = {};
  if(!st.ui || typeof st.ui !== "object" || Array.isArray(st.ui)) st.ui = { theme: "dark" };
  st.hideDebtNotice = !!st.hideDebtNotice;
  migrateTree(st.tree);
  return { st, fixes };
}

// Повреждённые данные НЕ затираются молча: исходная строка сохраняется
// отдельным ключом (STORAGE_KEY + "_broken_<время>"), иначе первое же
// сохранение перезаписало бы её навсегда.
// Хранится не больше MAX_BROKEN_COPIES последних копий — старые удаляются,
// чтобы не забить хранилище браузера.
function keepBrokenCopy(raw){
  try{
    const prefix = STORAGE_KEY + "_broken_";
    const old = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(prefix) === 0) old.push(k);
    }
    // Та же самая испорченная строка уже сохранена — второй раз не копируем
    if(old.some(k => localStorage.getItem(k) === raw)) return true;
    old.sort((a, b) => Number(a.slice(prefix.length)) - Number(b.slice(prefix.length)));
    while(old.length >= MAX_BROKEN_COPIES) localStorage.removeItem(old.shift());
    localStorage.setItem(prefix + Date.now(), raw);
    return true;
  }catch(e){ return false; }
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }
  catch(e){
    loadNotices.push({ type: "err", msg: "Хранилище браузера недоступно — данные не будут сохраняться (например, в приватном режиме)." });
    return defaultState();
  }
  if(!raw) return defaultState();
  try{
    const { st, fixes } = normalizeState(JSON.parse(raw));
    if(fixes.length){
      // Перезаписываем исправленным, только если исходник точно сохранён в копию
      if(keepBrokenCopy(raw)) persistAfterLoad = true;
      loadNotices.push({ type: "warn", msg: "Сохранённые данные были частично повреждены и исправлены: " + fixes.join("; ") + ". Копия исходных данных сохранена в браузере." });
    }
    return st;
  }catch(e){
    const kept = keepBrokenCopy(raw);
    if(kept) persistAfterLoad = true;
    loadNotices.push({ type: "err", msg: "Сохранённые данные повреждены — открыт новый план. " + (kept ? "Копия повреждённых данных сохранена в браузере. " : "") + "Восстановите данные из резервной копии: Настройки → Импорт JSON." });
    return defaultState();
  }
}

let state = load();

// Автосохранение после каждого изменения
function cleanTree(n){
  const c = {};
  for(const k in n){
    if(k === "amount" || k === "viewAmount" || k === "pctOfSalary" || k === "_depth" || k === "childBase" || k === "_income" || k === "_calc" || k === "_fixedWarnings") continue;
    c[k] = n[k];
  }
  if(Array.isArray(n.children)) c.children = n.children.map(cleanTree);
  return c;
}

// Чистое дерево для LocalStorage/экспорта (без вычисленных полей).
function snapState(){ return {...state, tree: cleanTree(state.tree)}; }
// Возвращает true, если данные записаны. Уведомления об успехе («Доход
// добавлен» и т.п.) показываем только тогда — иначе они противоречили бы
// сообщению об ошибке сохранения.
function save(){
  let ok = true;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(snapState())); }
  catch(e){ ok = false; toast("Не удалось сохранить данные: хранилище браузера недоступно или переполнено. Сделайте «Экспорт JSON», чтобы не потерять изменения.", "err"); }
  render();
  return ok;
}

/* ---------- форматирование ---------- */
function n2(v){ return (isFinite(v) && v!==null) ? v : 0; }
// Округление денег до копейки (2 знака) — вся иерархия считает копейками.
function round2(v){ return Math.round(n2(v) * 100) / 100; }
// Показываем копейки, только если они есть (иначе целые рубли).
function fmt(n){
  n = round2(n);
  if(n % 1 === 0) return n.toLocaleString('ru-RU', {maximumFractionDigits:0}) + " ₽";
  return n.toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2}) + " ₽";
}
// Сегодняшняя дата по местному времени (toISOString() — в UTC: ночью был бы вчерашний день).
function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
// Проценты по-русски, с запятой, как и рубли в fmt(): 27,4%. digits — знаков после запятой.
function pctFmt(p, digits){
  const d = digits == null ? 1 : digits;
  return n2(p).toLocaleString('ru-RU', {maximumFractionDigits: d}) + "%";
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Бегущая строка: дублируем текст, анимация сдвига на -50%.
   setupMarquees() измеряет ширину и включает прокрутку, только если текст не влезает. */
function mq(html){
  return `<div class="marquee"><div class="marquee-track"><span>${html}</span><span>${html}</span></div></div>`;
}

/* ---------- РАСЧЁТ ----------
   Всё считается в копейках (целые числа) — суммы всегда сходятся до копейки.

   1) План на цель — planTree(root, цель): водопад по дереву от «Цели на
      месяц» (state.monthGoal). В каждом контейнере % категории считаются от
      бюджета контейнера, фикс — своей суммой, остальное уходит в контейнер-
      остаток. Если % и фикс-суммы уровня вместе больше бюджета — все суммы
      уровня урезаются пропорционально, без приоритетов («На жизнь» — обычная
      категория, может быть хоть 0). Если остатка у уровня нет, а распределено
      меньше бюджета — недостающее добирается пропорционально %-категориям.
      Сумма по листьям = месячная цель каждой категории.

   2) Пополнения месяца — allocateMonth(), строго по порядку внесения:
      - пока доход месяца не достиг цели: пополнение делится ПОРОВНУ между
        категориями, которые ещё не набрали свою месячную цель; набравшая
        выбывает, её долю получают остальные;
      - всё, что сверх цели, — по процентам из настроек: итог месяца
        становится водопадом от фактической суммы (planTree(доход месяца)),
        фикс-категории к этому моменту уже заполнены.
      Доля пополнения №k зависит только от пополнений 1..k — новые доходы
      не пересчитывают уже распределённые. */
function toK(v){ return Math.round(n2(v) * 100); }
function sumArr(a){ return a.reduce((s,x) => s + x, 0); }

// Делит total копеек пропорционально весам (метод наибольших остатков).
// Все веса нулевые — поровну. Результат — целые копейки, сумма ровно total.
function apportionK(total, weights){
  const n = weights.length;
  const res = new Array(n).fill(0);
  if(!n || total <= 0) return res;
  let w = weights.map(x => Math.max(0, n2(x)));
  let sw = sumArr(w);
  if(sw <= 0){ w = w.map(() => 1); sw = n; }
  let used = 0;
  const fr = w.map((x, i) => {
    const exact = total * x / sw;
    const f = Math.floor(exact + 1e-9);
    res[i] = f; used += f;
    return { i, r: exact - f };
  });
  fr.sort((a, b) => b.r - a.r || a.i - b.i);
  for(let j = 0; j < total - used; j++) res[fr[j % n].i]++;
  return res;
}

// Водопад: заполняет out (uid -> копейки) для каждого узла от бюджета B.
function planTree(node, B, out){
  out.set(node.uid, B);
  const kids = node.children || [];
  if(!kids.length) return out;
  const rem = kids.find(ch => ch.kind === "base" && ch.value == null);
  const parts = kids.filter(ch => ch !== rem);
  const claims = parts.map(ch => ch.kind === "fixed"
    ? Math.max(0, n2(ch.value)) * 100
    : B * Math.max(0, n2(ch.value)) / 100);
  const claimSum = sumArr(claims);
  let alloc;
  if(claimSum > B || (!rem && parts.length)){
    let w = claims;
    if(claimSum < B){
      // Уровень без остатка недогружен — добираем пропорционально %-категориям
      // (если их нет — всем категориям уровня).
      const pctW = parts.map((ch, i) => ch.kind === "fixed" ? 0 : claims[i]);
      const extraW = sumArr(pctW) > 0 ? pctW : claims;
      const ew = sumArr(extraW);
      const left = B - claimSum;
      w = claims.map((c, i) => c + (ew > 0 ? left * extraW[i] / ew : left / parts.length));
    }
    alloc = apportionK(B, w);
  } else {
    alloc = claims.map(c => Math.round(c));
    if(sumArr(alloc) > B) alloc = apportionK(B, claims);
  }
  let used = 0;
  parts.forEach((ch, i) => { used += alloc[i]; planTree(ch, alloc[i], out); });
  if(rem) planTree(rem, Math.max(0, B - used), out);
  return out;
}

// Листья распределения: категории (и пустые контейнеры — чтобы деньги не терялись).
function allocLeaves(root){
  return flatten(root).filter(n => n !== root && !(n.children && n.children.length));
}

// Равномерное заполнение: X копеек поровну между категориями со свободным
// местом (rooms); заполненная выбывает. Возвращает {got, left}.
function waterfillK(rooms, X){
  const got = rooms.map(() => 0);
  let active = rooms.map((_, i) => i).filter(i => rooms[i] > 0);
  while(X > 0 && active.length){
    const m = active.length;
    const minRoom = Math.min(...active.map(i => rooms[i] - got[i]));
    if(minRoom * m <= X){
      active.forEach(i => { got[i] += minRoom; });
      X -= minRoom * m;
      active = active.filter(i => rooms[i] - got[i] > 0);
    } else {
      const q = Math.floor(X / m);
      let r = X - q * m;
      active.forEach(i => { got[i] += q + (r > 0 ? 1 : 0); if(r > 0) r--; });
      X = 0;
    }
  }
  return { got, left: X };
}

// Копеечные «минусы» от округления (сверх цели) — забираем у самой крупной доли.
function fixNegativesK(d){
  let deficit = 0;
  d.forEach((v, i) => { if(v < 0){ deficit -= v; d[i] = 0; } });
  while(deficit > 0){
    let j = -1;
    d.forEach((v, i) => { if(v > 0 && (j < 0 || v > d[j])) j = i; });
    if(j < 0) break;
    const take = Math.min(deficit, d[j]);
    d[j] -= take; deficit -= take;
  }
  return d;
}

// Распределение пополнений месяца (см. комментарий выше). Всё в копейках.
function allocateMonth(root, entries, goalK){
  const leafs = allocLeaves(root);
  const planGoal = planTree(root, goalK, new Map());
  const targets = leafs.map(l => n2(planGoal.get(l.uid)));
  let S = leafs.map(() => 0);   // накоплено по категориям за месяц
  let T = 0;                    // доход месяца нарастающим итогом
  const steps = [];
  entries.forEach(e => {
    const I = toK(Math.max(0, n2(e.amount)));
    const delta = leafs.map(() => 0);
    const fillPart = Math.min(I, Math.max(0, goalK - T));
    let left = 0;
    if(fillPart > 0){
      const wf = waterfillK(targets.map((t, i) => Math.max(0, t - S[i])), fillPart);
      wf.got.forEach((g, i) => { delta[i] += g; });
      left = wf.left;
    }
    T += I;
    const extra = I - fillPart + left;
    if(extra > 0){
      const desired = planTree(root, T, new Map());
      const d = leafs.map((l, i) => n2(desired.get(l.uid)) - S[i] - delta[i]);
      fixNegativesK(d);
      d.forEach((v, i) => { delta[i] += v; });
    }
    S = S.map((s, i) => s + delta[i]);
    steps.push({ entry: e, delta });
  });
  return { leafs, targets, total: S, steps, totalK: T, goalK };
}

// node.amount — план на цель месяца (читают Настройки).
function applyAmounts(node, map){
  node.amount = n2(map.get(node.uid)) / 100;
  (node.children||[]).forEach(ch => applyAmounts(ch, map));
}
// node.viewAmount — то, что видно на главной: листья из leafK, контейнеры — сумма детей.
function applyViewK(node, leafK){
  let k;
  if(leafK.has(node.uid)) k = leafK.get(node.uid);
  else k = (node.children||[]).reduce((s, ch) => s + applyViewK(ch, leafK), 0);
  node.viewAmount = k / 100;
  return k;
}

const LIFE_UID = "b5";
const MIN_GOAL = 1000; // цель на месяц не может быть меньше (0 — запрещён)
const LIFE_MIN = 10000; // ниже — показываем рекомендацию увеличить «На жизнь»

function computeTree(){
  const root = state.tree;
  const inc = getSelectedIncome();
  const goalK = toK(Math.max(0, n2(state.monthGoal)));
  applyAmounts(root, planTree(root, goalK, new Map()));

  const calc = allocateMonth(root, inc.entries, goalK);
  const toMap = arr => new Map(calc.leafs.map((l, i) => [l.uid, arr[i]]));
  let viewArr;
  if(!state.incomes.length) viewArr = calc.targets;           // доходов нет — план на цель
  else if(inc.selectedEntry){
    const st = calc.steps.find(s => s.entry.id === inc.selectedEntry.id);
    viewArr = st ? st.delta : calc.leafs.map(() => 0);
  } else viewArr = calc.total;
  applyViewK(root, toMap(viewArr));

  // «На жизнь» за месяц: пока цель не достигнута — сколько будет по плану,
  // после — сколько уже есть по факту.
  const lifeIdx = calc.leafs.findIndex(l => l.uid === LIFE_UID);
  let lifeK = null;
  if(lifeIdx >= 0){
    lifeK = calc.totalK >= goalK ? calc.total[lifeIdx] : calc.targets[lifeIdx];
  }

  const viewRootAmt = n2(root.viewAmount);
  (function setPct(n){
    (n.children||[]).forEach(ch => { setPct(ch); });
    n.pctOfSalary = viewRootAmt > 0 ? (n2(n.viewAmount)/viewRootAmt)*100 : 0;
  })(root);
  root._income = inc;
  root._calc = { goalK, monthK: calc.totalK, lifeK, lifeName: lifeIdx >= 0 ? calc.leafs[lifeIdx].name : "" };
  return root;
}

// Рекомендация по «На жизнь» (или "" — если всё в порядке).
function lifeHintHTML(lifeK, name, where){
  if(lifeK == null || lifeK >= LIFE_MIN * 100) return "";
  return `<div class="lvl-note warn" style="margin-top:8px;">💡 «${esc(name)}» ${where} — ${fmt(lifeK/100)}, это меньше ${fmt(LIFE_MIN)}. Рекомендуем увеличить эту категорию, чтобы на повседневные расходы не приходилось брать деньги из других категорий.</div>`;
}

/* ---------- выбор месяца/года на главной ----------
   Временный выбор НЕ сохраняется: при перезагрузке страницы снова берётся
   месяц последней записи. В пределах сеанса выбор запоминается в памяти. */
let selMonth = null; // 1..12
let selYear = null;
// Ручной выбор конкретного пополнения на главной (сессионный, не сохраняется):
// null       — авто, показываем «Итого за месяц» (по умолчанию)
// "__ALL__"  — пользователь явно выбрал «Итого за месяц»
// иначе      — id конкретного пополнения
let selIncomeChoice = null;

// Месяц/год самой поздней записи ПО ДАТЕ (не последней добавленной в массив).
function lastIncomePeriod(){
  const inc = state.incomes;
  if(!inc.length) return null;
  let best = null;
  inc.forEach(i => {
    if(!i || !i.date) return;
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return;
    const y = d.getFullYear(), m = d.getMonth()+1;
    if(!best || y > best.year || (y === best.year && m > best.month)){
      best = { month: m, year: y };
    }
  });
  return best;
}

// Последняя запись по дате.
function latestIncome(){
  let best = null;
  (state.incomes||[]).forEach(i => {
    if(!i || !i.date) return;
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return;
    // >= — при одинаковой дате «последний» = добавленный позже
    if(!best || d.getTime() >= new Date(best.date + "T00:00:00").getTime()) best = i;
  });
  return best;
}

// Сумма всех поступлений за указанный месяц/год
function incomeByPeriod(month, year){
  return state.incomes.reduce((s,i)=>{
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return s;
    if(d.getMonth()+1 === month && d.getFullYear() === year) return s + n2(i.amount);
    return s;
  }, 0);
}

// Список отдельных поступлений за указанный месяц/год (для селектора «Пополнение»)
function incomeEntriesByPeriod(month, year){
  return state.incomes.filter(i => {
    if(!i || !i.date) return false;
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return false;
    return d.getMonth()+1 === month && d.getFullYear() === year;
  });
}

// Выбранное пополнение-основание (или null — сумма месяца).
function resolveIncomeSelection(entries){
  if(selIncomeChoice === "__ALL__") return null; // пользователь явно выбрал «Итого за месяц»
  if(selIncomeChoice){
    const found = entries.find(e => e.id === selIncomeChoice);
    if(found) return found;
    selIncomeChoice = null; // выбранное пополнение удалено/из другого периода — сбрасываем на авто
  }
  return null;
}

// total — основание для расчёта (сумма месяца или одно пополнение).
function getSelectedIncome(){
  const lp = lastIncomePeriod();
  if(!lp){ return { month: null, year: null, total: round2(Math.max(0, n2(state.monthGoal))), monthTotal: 0, entries: [], selectedEntry: null }; }
  // при первом обращении берём месяц последней записи
  if(selMonth === null){ selMonth = lp.month; selYear = lp.year; }
  const entries = incomeEntriesByPeriod(selMonth, selYear);
  const monthTotal = round2(entries.reduce((s,i)=>s+n2(i.amount),0));
  const selectedEntry = resolveIncomeSelection(entries);
  const total = selectedEntry ? round2(n2(selectedEntry.amount)) : monthTotal;
  return { month: selMonth, year: selYear, total, monthTotal, entries, selectedEntry };
}

// Процент с ОДНИМ знаком: 12 → "12%", 30.4 → "30.4%"
// Дата коротко: 2026-10-22 → 22.10.2026
function dateShort(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  return m ? `${m[3]}.${m[2]}.${m[1]}` : String(iso || "");
}

// Русские названия месяцев (для заголовка и подписи)
const MONTHS_GEN = ["","января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_NOM = ["","Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
// Названия месяцев для селектора (сокращённо, для компактности)
const MONTHS_SHORT = ["","янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
/* Плоский список всех узлов дерева (в порядке обхода) — для отображения иерархии */
function flatten(node, arr){
  arr = arr || [];
  arr.push(node);
  (node.children||[]).forEach(c => flatten(c, arr));
  return arr;
}

/* Только листовые категории (что идёт в график) */
function leaves(node, arr){
  arr = arr || [];
  (node.children||[]).forEach(ch => {
    if(ch.kind === "pct" || ch.kind === "fixed") arr.push(ch);
    else leaves(ch, arr);
  });
  return arr;
}

/* Найти узел по uid, [опционально] вернуть родителя */
function findNode(node, uid, parent){
  if(node.uid === uid) return { node, parent };
  for(const c of (node.children||[])){
    const r = findNode(c, uid, node);
    if(r) return r;
  }
  return null;
}
function findParentOf(node, uid, parent){
  if((node.children||[]).some(c => c.uid === uid)) return node;
  for(const c of (node.children||[])){
    const r = findParentOf(c, uid, node);
    if(r) return r;
  }
  return null;
}

/* Уровни вложенности для пользовательских категорий */
const LEVELS = [
  { id: "root", label: "Уровень 1 — от всего дохода", containerUid: "root", isBase: false },
  { id: "ost",  label: "Уровень 2 — от Остатка", containerUid: "b4", isBase: true },
  { id: "svob", label: "Уровень 3 — от Свободного остатка", containerUid: "b6", isBase: true },
];

function containerByLevel(levelId){
  const L = LEVELS.find(l => l.id === levelId);
  // Если уровень не найден или ссылается на контейнер, которого нет в дереве
  // (например, после ручной правки импортированного JSON) — безопасно
  // откатываемся на корень, а не падаем с ошибкой.
  if(!L || L.containerUid === "root") return { parent: state.tree, isBase: false };
  const p = findNode(state.tree, L.containerUid);
  return { parent: p ? p.node : state.tree, isBase: L.isBase };
}

// Добавляет категорию на свой уровень, а не в конец всего дерева: если у
// контейнера есть дочерний «остаток» (следующий уровень вложенности), новая
// категория вставляется ПЕРЕД ним — иначе при показе (flatten()) она попадёт
// после всей вложенной поддерева следующих уровней и будет выглядеть так,
// будто уходит с более глубокого уровня, чем на самом деле.
function insertCategoryChild(parent, node){
  parent.children = parent.children || [];
  const remIdx = parent.children.findIndex(ch => ch.kind === "base" && ch.value == null);
  if(remIdx === -1) parent.children.push(node);
  else parent.children.splice(remIdx, 0, node);
}

function freshUid(){

}

/* ---------- уведомления ----------
   Сообщения в ответ на действие (запрет, ошибка, результат импорта)
   показываем всплывающим уведомлением сверху — не прокручивая страницу.
   Закрыть: ✕, смахнуть вбок или подождать. type: "err" | "warn" | "ok". */
const TOAST_MS = 7000;
function toast(msg, type){
  type = type || "err";
  const box = document.getElementById("toasts");
  if(!box) return;
  // Одинаковое сообщение не дублируем — показываем заново
  [...box.children].forEach(el => { if(el.dataset.msg === msg) el.remove(); });
  while(box.children.length >= 3) box.firstElementChild.remove();
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.dataset.msg = msg;
  el.setAttribute("role", type === "ok" ? "status" : "alert");
  const ic = document.createElement("span"); ic.className = "t-ic"; ic.textContent = type === "ok" ? "✓" : type === "warn" ? "💡" : "⚠";
  const txt = document.createElement("span"); txt.className = "t-txt"; txt.textContent = msg;
  const x = document.createElement("button"); x.type = "button"; x.className = "t-x"; x.setAttribute("aria-label", "Закрыть"); x.textContent = "✕";
  el.append(ic, txt, x);
  box.appendChild(el);

  let timer = null;
  const close = (dir) => {
    clearTimeout(timer);
    el.style.transform = dir ? `translateX(${dir * 120}%)` : "translateY(-10px)";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 200);
  };
  const arm = () => { clearTimeout(timer); timer = setTimeout(() => close(0), TOAST_MS); };
  x.addEventListener("click", () => close(0));
  arm();

  // Смахивание вбок (палец или мышь)
  let startX = null, dx = 0;
  el.addEventListener("pointerdown", e => {
    if(e.target === x) return;
    startX = e.clientX; dx = 0;
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);
    clearTimeout(timer);
  });
  el.addEventListener("pointermove", e => {
    if(startX === null) return;
    dx = e.clientX - startX;
    el.style.transform = `translateX(${dx}px)`;
    el.style.opacity = String(Math.max(0.2, 1 - Math.abs(dx) / 240));
  });
  const end = () => {
    if(startX === null) return;
    startX = null;
    el.classList.remove("dragging");
    if(Math.abs(dx) > 70) close(dx > 0 ? 1 : -1);
    else { el.style.transform = ""; el.style.opacity = ""; arm(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ---------- окно подтверждения ----------
   confirmDialog({title, html, okText}, onOk): «Отмена» / кнопка действия.
   Закрывается без действия по «Отмена», тапу по фону или Esc. */
function confirmDialog(opts, onOk){
  document.querySelector(".modal-back")?.remove();
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(opts.title || "Подтвердите действие")}</h3>
      <div class="m-txt">${opts.html || ""}</div>
      <div class="m-btns">
        <button type="button" class="btn secondary" data-m-cancel>Отмена</button>
        <button type="button" class="btn danger-solid" data-m-ok>${esc(opts.okText || "Удалить")}</button>
      </div>
    </div>`;
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if(e.key === "Escape") close(); };
  back.addEventListener("click", e => { if(e.target === back) close(); });
  back.querySelector("[data-m-cancel]").addEventListener("click", close);
  back.querySelector("[data-m-ok]").addEventListener("click", () => { close(); onOk(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(back);
  back.querySelector("[data-m-cancel]").focus();
}

function renderHome(root){
  const all = flatten(root);
  const inc = root._income;
  const total = inc.total;               // доход за выбранный период
  const floor = Math.max(0, n2(total));

  // Доступные месяцы/годы для селектора — из истории доходов
  const avail = {};
  state.incomes.forEach(i => {
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return;
    avail[d.getFullYear()] = 1;
  });
  const years = Object.keys(avail).map(Number).sort((a,b)=>a-b);
  const selY = inc.year !== null ? inc.year : (years.length ? years[years.length-1] : new Date().getFullYear());
  const monthOpts = MONTHS_NOM.map((mn, m) => m===0 ? "" : `<option value="${m}" ${inc.month===m ? "selected":""}>${mn}</option>`).join("");
  const yearOpts = years.length
    ? years.map(y => `<option value="${y}" ${selY===y ? "selected":""}>${y}</option>`).join("")
    : "".concat(`<option value="${new Date().getFullYear()}">${new Date().getFullYear()}</option>`);

  // Переключатель месяца и года (временный, не сохраняется)
  const periodCtrl = `
    <div class="period-row">
      <select id="selMonth" class="period-select">${monthOpts}</select>
      <select id="selYear" class="period-select">${yearOpts}</select>
    </div>`;

  // Селектор конкретного пополнения месяца (появляется, если есть хоть одно пополнение).
  // «Итого за месяц» всегда первым пунктом — выбор основания для расчёта % не сохраняется,
  // это сессионный просмотр (аналогично выбору месяца/года).
  const incomeSelCtrl = inc.entries.length ? `
    <div class="period-row" style="margin-top:8px;">
      <select id="selIncomeEntry" class="period-select" style="flex:1 1 100%;">
        <option value="__ALL__" ${!inc.selectedEntry ? "selected":""}>Итого за месяц — ${fmt(inc.monthTotal)}</option>
        ${inc.entries.map(e => `<option value="${esc(e.id)}" ${inc.selectedEntry && inc.selectedEntry.id===e.id ? "selected":""}>${esc(dateShort(e.date))}${e.comment ? " · "+esc(e.comment) : ""} — ${fmt(e.amount)}</option>`).join("")}
      </select>
    </div>` : "";

  // Заголовок суммы: «Доход за сентябрь 2026 г.» либо «Пополнение от ...», если выбрано одно
  const title = inc.selectedEntry
    ? `Пополнение от ${ruDate(inc.selectedEntry.date)}${inc.selectedEntry.comment ? " · "+inc.selectedEntry.comment : ""}`
    : (inc.month ? `Доход за ${MONTHS_NOM[inc.month].toLowerCase()} ${selY} г.` : "Доход не выбран");
  const chartCaption = inc.selectedEntry ? "Выбранное пополнение" : (state.incomes.length ? "Доход за месяц" : "План на цель");

  // Цель месяца: сколько уже пришло и что дальше (см. allocateMonth()).
  const calc = root._calc;
  const goal = calc.goalK / 100, got = calc.monthK / 100;
  let goalHTML = "";
  // Цель — про месяц целиком: при выборе отдельного пополнения не показываем
  if(inc.month && !inc.selectedEntry){
    const pctGoal = Math.min(100, got / goal * 100);
    goalHTML = `
      <div class="row"><div class="label">Цель на месяц</div><div class="value">${fmt(goal)}</div></div>
      <div class="goal-bar"><div style="width:${pctGoal.toFixed(1)}%"></div></div>
      ${got >= goal
        ? `<div class="check-banner good">✓ Цель месяца достигнута${got > goal ? ` · сверх цели ${fmt(got - goal)} распределено по процентам из настроек` : ""}.</div>`
        : `<div class="lock-note">До цели: ${fmt(goal - got)} (${pct1(pctGoal)} собрано). Пока цель не достигнута, каждое пополнение делится поровну между категориями, которые ещё не набрали свою месячную сумму.</div>`}`;
  }
  const lifeHint = lifeHintHTML(calc.lifeK, calc.lifeName, state.incomes.length ? "в этом месяце" : "по плану на месяц");

  // Дерево распределения: два столбца (название слева, значение справа).
  // У контейнеров («Доход», «Остаток», «Свободный остаток») значение по центру колонки.
  const treeHTML = all.map(node => {
    const isContainer = (node.kind==="root"||node.kind==="base");
    const cls = isContainer ? "container" : "";
    // Название корня — «Доход» (вместо «Зарплата»)
    const name = node.uid === "root" ? "Доход" : node.name;
    const tag = node.kind==="fixed" ? '<span class="tag gray">фикс</span>'
              : node.kind==="pct" ? '<span class="tag safe">%</span>' : "";
    const cnt = node.custom ? `<span class="cnt">[своя]</span>` : "";
    // Проценты без приписки «от ЗП» — только число со знаком %: 12%
    const pctTxt = isContainer ? "" : `<span class="pct"> · ${pct1(node.pctOfSalary)}</span>`;
    // Все строки — одним списком без отступов: названия слева, значения по колонкам.
    // Длинные названия — бегущей строкой (mq), чтобы ничего не вылезало за экран.
    const myIndent = 0;
    const nameHTML = cnt + esc(name) + (tag ? " " + tag : "");
    return `<div class="tree-line ${cls} indent-${myIndent} ${isContainer?"tree-line-c":""}">
      <div class="tname">${mq(nameHTML)}</div>
      <div class="tamount">${fmt(node.viewAmount)}${isContainer ? "" : pctTxt}</div>
    </div>`;
  }).join("");

  return `
    <div class="card">
      <h2>Распределение</h2>
      <div class="chart-wrap">
        <canvas id="distChart" height="320"></canvas>
        <div class="chart-center">
          <div class="v">${fmt(floor)}</div>
          <div class="c">${esc(chartCaption)}</div>
        </div>
      </div>
      <div class="legend" id="distLegend"></div>
    </div>

    <div class="card">
      <h2>Доход за месяц</h2>
      ${periodCtrl}
      ${incomeSelCtrl}
      ${inc.month ? `
        <div class="row" style="margin-top:8px;"><div class="label">${esc(title)}</div><div class="value pos">${fmt(total)}</div></div>
        ${goalHTML}
      ` : `<div class="empty">Доходов пока нет — добавьте первую запись. Ниже — план на цель ${fmt(goal)} в месяц.</div>`}
      ${lifeHint}
      <div style="height:12px;"></div>
      <button class="btn btn-big" id="goAddIncome"><span class="plus">＋</span>Добавить доход</button>
    </div>

    <div class="card">
      <h2>Как делится доход</h2>
      <div style="margin-top:4px;">${treeHTML}</div>
    </div>

    <div class="reminder">
      📅 Вносите <b>каждый доход</b>, даже если суммы небольшие.
    </div>
  `;
}

/* ---------- график (donut) ----------
   Сектора без стрелочек и подписей: детали видны при наведении (tooltip)
   и в списке под диаграммой. Процент — всегда с ОДНИМ знаком «%»: 12%, 30.4%.
*/
let chart = null;
// Цвет категории — по её месту в дереве (а не среди ненулевых), поэтому у
// категории всегда один и тот же цвет. Оттенки идут через «золотой угол»
// (≈137,5°) — соседние категории максимально различаются, сколько бы их ни
// было; яркость и насыщенность чередуются. Без чёрного и белого: L 52–72%.
function catColor(i){
  const hue = (39 + i * 137.508) % 360;
  const light = [62, 52, 72][i % 3];
  const sat = [62, 70, 52][Math.floor(i / 3) % 3];
  return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
}

function drawChart(){
  const canvas = document.getElementById("distChart");
  if(!canvas) return;
  const items = leaves(state.tree)
    .map((l, i) => ({ l, color: catColor(i) }))
    .filter(x => n2(x.l.viewAmount) > 0);
  const root = state.tree;
  const total = n2(root._income && root._income.total);

  // Список под диаграммой: цвет · название · сумма · процент (один знак %)
  const legend = document.getElementById("distLegend");
  if(legend){
    legend.innerHTML = items.length ? items.map(({ l: it, color }) => `
      <div class="lg">
        <span class="sw" style="background:${color}"></span>
        <span class="nm">${esc(it.name)}</span>
        <span class="vv">${fmt(it.viewAmount)} · ${pct1(it.pctOfSalary)}</span>
      </div>`).join("")
      : `<div class="empty">${state.incomes.length ? "В этом месяце доходов нет — выберите другой месяц или добавьте доход." : "Нет данных для диаграммы."}</div>`;
  }
  // Пустой месяц — не показываем пустой круг на пол-экрана
  const wrap = canvas.closest(".chart-wrap");
  if(wrap) wrap.style.display = items.length ? "" : "none";

  if(chart) chart.destroy();
  if(typeof Chart === "undefined"){
    // Chart.js не загрузился (например, первый запуск без интернета):
    // легенда и суммы уже отрисованы выше — просто пропускаем диаграмму.
    chart = null;
    return;
  }
  if(!items.length){
    chart = null;
    return;
  }
  chart = new Chart(canvas.getContext("2d"), {
    type: "doughnut",
    data: {
      labels: items.map(x => x.l.name),
      datasets: [{
        data: items.map(x => n2(x.l.viewAmount)),
        backgroundColor: items.map(x => x.color),
        borderColor: "#16315A",
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: "58%",
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const val = ctx.parsed;
              const pct = total>0 ? (val/total*100) : 0;
              return ` ${fmt(val)} · ${pct1(pct)}`;    // один знак «%»
            }
          }
        }
      }
    },
    plugins: {}
  });
}

/* ================= ЭКРАН «НАСТРОЙКИ» ================= */
// Сообщение о заблокированном изменении (проценты уровня > 100%)
// Временный черновик формы «Пользовательские категории», чтобы при блокировке
// (render без сохранения) введённые данные не пропадали.
let customDraft = null;

// Хватает ли основы уровня под категорию uid в дереве tree (план на цель месяца).
// Проценты считаются от основы, фикс-суммы — в рублях; вместе они не могут
// выйти за основу. Если основа уровня 0 ₽ (напр. «Свободный остаток» пуст) —
// проценты вводить можно (это доля от будущего остатка), а рубли — нет.
function checkLevel(tree, uid){
  const parent = findParentOf(tree, uid);
  const nd = findNode(tree, uid).node;
  const B = n2(planTree(tree, toK(Math.max(0, n2(state.monthGoal))), new Map()).get(parent.uid)) / 100;
  const kids = parent.children || [];
  const isPctPart = c => c.kind === "pct" || (c.kind === "base" && c.value != null);
  const pctOthers = kids.filter(c => isPctPart(c) && c.uid !== uid).reduce((s,c) => s + n2(c.value), 0);
  const fixOthers = kids.filter(c => c.kind === "fixed" && c.uid !== uid).reduce((s,c) => s + n2(c.value), 0);
  const roomPct = Math.max(0, 100 - pctOthers - (B > 0 ? fixOthers / B * 100 : 0));
  const roomRub = Math.max(0, B * (1 - pctOthers/100) - fixOthers);
  const ok = nd.kind === "fixed" ? n2(nd.value) <= roomRub + 0.005 : n2(nd.value) <= roomPct + 1e-6;
  return { ok, kind: nd.kind, parentUid: parent.uid, base: B,
    roomPct: Math.floor(roomPct * 100) / 100, roomRub: Math.floor(roomRub * 100) / 100 };
}

// Применяет изменение к копии дерева, проверяет уровень категории uid и только
// тогда сохраняет. Уменьшать значение на своём уровне можно всегда — иначе уже
// перегруженный уровень было бы не исправить. onFail — перед показом запрета
// (напр. сохранить черновик формы). Возвращает true, если сохранено.
function tryTreeChange(uid, mutate, onFail){
  const copy = JSON.parse(JSON.stringify(cleanTree(state.tree)));
  const before = findNode(copy, uid);
  const old = before ? { kind: before.node.kind, value: n2(before.node.value), parentUid: findParentOf(copy, uid).uid } : null;
  mutate(copy);
  const nd = findNode(copy, uid).node;
  // 0% не имеет смысла: ненужную категорию удаляют или переводят в ₽ с суммой 0
  if(nd.kind === "pct" && !(n2(nd.value) > 0)){
    if(onFail) onFail();
    render();
    toast("Процент должен быть больше 0. Если категория не нужна — удалите её или переведите в ₽ и поставьте 0.", "warn");
    return false;
  }
  const r = checkLevel(copy, uid);
  const decreased = old && old.kind === nd.kind && old.parentUid === r.parentUid && n2(nd.value) <= old.value + 1e-9;
  if(!r.ok && !decreased){
    const msg = r.kind === "fixed"
      ? `Нельзя: сумма превысит основу уровня (${fmt(r.base)} при цели ${fmt(n2(state.monthGoal))}). Доступно ещё ${fmt(r.roomRub)}.`
      : `Нельзя: вместе с остальными категориями уровня проценты превысят основу (${fmt(r.base)}). Доступно ещё ${pctFmt(r.roomPct, 2)}${r.base > 0 ? ` (≈ ${fmt(r.base * r.roomPct / 100)})` : ""}.`;
    if(onFail) onFail();
    render();   // вернуть в поле прежнее значение
    toast(msg, "err");
    return false;
  }
  state.tree = copy;
  save();
  return true;
}

// Информация об уровнях иерархии (для блока «Категории»)
const CAT_LEVELS = [
  { containerUid: "root", baseName: "Цель на месяц", title: "Уровень 1 — от всего дохода",
    baseShort: "всего дохода", baseFull: "план считается от цели на месяц; остаток уходит в «Остаток»" },
  { containerUid: "b4",   baseName: "Остаток", title: "Уровень 2 — от остатка",
    baseShort: "остатка", baseFull: "всё, что осталось после категорий уровня 1; нераспределённое уходит в «Свободный остаток»" },
  { containerUid: "b6",   baseName: "Свободный остаток", title: "Уровень 3 — от свободного остатка",
    baseShort: "свободного остатка", baseFull: "свободный остаток — всё, что осталось после категорий уровня 2" },
];

// Отрисовка одного редактируемого уровня категорий
function renderCatLevel(container, info){
  const kids = (container.children||[]).filter(ch => ch.kind==="pct" || ch.kind==="fixed");
  if(!kids.length) return "";
  // Статистика уровня: сколько занимают проценты, фикс-суммы и контейнеры-проценты
  const base = n2(container.amount);                      // «Основа» уровня
  const pctSum  = kids.filter(k=>k.kind==="pct").reduce((s,k)=>s+n2(k.value),0);
  const fixedSum= kids.filter(k=>k.kind==="fixed").reduce((s,k)=>s+n2(k.value),0);
  const baseSum = (container.children||[]).filter(ch=>ch.kind==="base" && ch.value != null).reduce((s,k)=>s+n2(k.value),0);
  const fixedPct = base>0 ? fixedSum/base*100 : 0;
  const usedPct  = pctSum + fixedPct + baseSum;           // сколько % основания задействовано
  const overAll  = pctSum + baseSum > 100 + 1e-9;         // проценты уровня упёрлись в 100%
  // Перегруз: % и фикс-суммы вместе больше основы — planTree() урежет все суммы
  // уровня пропорционально (см. комментарий к расчёту).
  const overload = usedPct > 100 + 1e-6 || (base <= 0 && fixedSum > 0);
  // Есть ли контейнер-«остаток» (value == null): он забирает всё, что не ушло выше.
  const hasRemainder = (container.children||[]).some(ch => ch.kind==="base" && ch.value == null);
  let note = "";
  if(overAll){
    note = `<div class="lvl-note err">⚠ Сумма процентов этого уровня больше 100% — уменьшите проценты.</div>`;
  } else if(overload){
    note = `<div class="lvl-note err">⚠ Проценты и фиксированные суммы этого уровня вместе больше основы (${pctFmt(usedPct)}) — все суммы уровня пропорционально урезаны${hasRemainder ? ", на следующий уровень ничего не остаётся" : ""}. Уменьшите проценты или фиксированные суммы, либо увеличьте цель на месяц.</div>`;
  } else if(!hasRemainder && usedPct < 100 - 1e-9){
    const rem = Math.max(0, base - usedPct/100*base);
    note = `<div class="lvl-note warn">Проценты уровня меньше 100%: оставшиеся ≈ ${fmt(rem)} из ${fmt(base)} делятся между категориями уровня пропорционально.</div>`;
  }
  if(container.uid === "b4"){
    const life = (container.children||[]).find(ch => ch.uid === LIFE_UID);
    if(life) note += lifeHintHTML(toK(life.amount), life.name, "по плану на месяц");
  }
  const rows = kids.map(node => {
    const isPct = node.kind === "pct";
    const tag = node.custom ? '<span class="tag gray">своя</span>' : "";
    // Пояснение, от чего считается значение
    const desc = isPct
      ? `${pctFmt(node.value)} от ${info.baseShort}`
      : `фикс ${fmt(node.value)} · от ${info.baseShort}`;
    // Красная подсветка — уровень перегружен, сумма урезана.
    const overFix = overload && round2(node.amount) + 0.005 < (isPct ? round2(base*n2(node.value)/100) : round2(n2(node.value)));
    const valInput = isPct
      ? `<input type="number" class="cat-inp${overFix?" over":""}" data-set-value="${node.uid}" data-kind="pct" value="${n2(node.value)}" step="0.1" min="0.1"><span class="inp-sfx">%</span>
         <span class="amount${overFix?" over":""}">${fmt(node.amount)}</span>`
      : `<input type="number" class="cat-inp${overFix?" over":""}" data-set-value="${node.uid}" data-kind="fixed" value="${n2(node.value)}" step="1" min="0" inputmode="decimal"><span class="inp-sfx">₽</span>
         <span class="amount${overFix?" over":""}">${fmt(node.amount)}</span>`;
    return `
      <div class="cat-level-row">
        <div class="cat-left">
          <div class="cat-name">${mq(tag + esc(node.name))}<button type="button" class="cat-edit" data-edit-name="${node.uid}" title="Переименовать">✎</button></div>
          <div class="cat-desc">${esc(desc)}</div>
        </div>
        <div class="cat-right">
          <div class="seg" data-seg="${node.uid}">
            <button data-seg-kind="pct" class="${isPct?'active':''}">%</button>
            <button data-seg-kind="fixed" class="${!isPct?'active':''}">₽</button>
          </div>
          ${valInput}
        </div>
      </div>`;
  }).join("");
  // Подзаголовок уровня + база (от чего считаются проценты) + заметка про 100%
  return `
    <div class="cat-level">
      <div class="cat-level-title">${esc(info.title)}</div>
      <div class="cat-level-base">Основа: <span class="bs">${esc(info.baseName)} — ${fmt(n2(container.amount))}</span> · ${esc(info.baseFull)}</div>
      ${note}
      ${rows}
    </div>`;
}

function renderSettings(root){
  // Сообщение о заблокированном изменении (показывается один раз)
  // Черновик формы своих категорий (на случай блокировки)
  const draft = customDraft; customDraft = null;
  // редактируемая иерархия категорий — сгруппирована по уровням
  const levelHTML = CAT_LEVELS.map(info => {
    const hit = findNode(state.tree, info.containerUid);
    if(!hit) return "";
    return renderCatLevel(hit.node, info);
  }).join("");

  // пользовательские категории (для управления уровнем/удалением)
  const all = flatten(root);
  const custom = all.filter(n => n.custom && (n.kind==="pct"||n.kind==="fixed"));
  const customRows = custom.map(n => {
    const container = findParentOf(state.tree, n.uid);
    const levelId = LEVELS.find(L => L.containerUid === container.uid) ? LEVELS.find(L => L.containerUid === container.uid).id : "root";
    return `
      <div class="set-row">
        <div class="s-name">${mq(esc(n.name))}<small>${levelId==="root"?"Уровень 1":levelId==="ost"?"Уровень 2":"Уровень 3"} · ${n.kind==="pct" ? pctFmt(n.value) : fmt(n.value)}</small></div>
        <select class="change-level" data-custom-level="${n.uid}">
          <option value="root" ${levelId==="root"?"selected":""}>Ур.1 (Доход)</option>
          <option value="ost" ${levelId==="ost"?"selected":""}>Ур.2 (Остаток)</option>
          <option value="svob" ${levelId==="svob"?"selected":""}>Ур.3 (Своб.ост.)</option>
        </select>
        <button class="btn danger" data-del-custom="${n.uid}" style="width:auto;padding:8px 12px;">Удалить</button>
      </div>`;
  }).join("") || `<div class="lock-note">Пользовательских категорий пока нет.</div>`;

  const levelOpts = LEVELS.map(l => `<option value="${l.id}" ${draft && draft.level === l.id ? "selected":""}>${l.label}</option>`).join("");

  return `
    ${state.hideDebtNotice ? "" : `
      <div class="card">
        <div class="debt-notice">
          ⚠️ Этот финансовый план работает только при отсутствии кредитов и долгов. Если есть долг — сначала закройте его.
          <button type="button" class="debt-close" data-close-debt title="Больше не показывать">✕</button>
        </div>
      </div>`}

    <div class="card">
      <h2>Цель на месяц</h2>
      <div class="section-note">Сколько вы планируете получать в месяц. От этой суммы считается план каждой категории (суммы справа в «Категориях»).<br><br>
        <b>Как распределяется доход.</b> Пока доход месяца меньше цели, каждое пополнение делится поровну между категориями; категория, набравшая свою месячную сумму, выбывает, а её долю получают остальные. Всё, что сверх цели, делится по процентам из настроек (фиксированные суммы к этому времени уже собраны). Уже внесённые пополнения при добавлении новых не пересчитываются.</div>
      <label class="field">Цель, ₽ в месяц</label>
      <input type="number" id="goalInput" value="${n2(state.monthGoal)}" min="${MIN_GOAL}" step="1000" inputmode="decimal">
    </div>

    <div class="card">
      <h2>Категории</h2>
      <div class="section-note">Меняйте % или фиксированную сумму. Все зависимые суммы пересчитаются автоматически. Проценты и суммы уровня вместе не могут превысить его основу (план на цель месяца); уменьшать значения можно всегда.</div>
      ${levelHTML || `<div class="lock-note">Категорий нет.</div>`}
    </div>

    <div class="card">
      <h2>Пользовательские категории</h2>

        </div>

    </div>
  `;
}

function ruDate(iso){
  const d = new Date(iso + "T00:00:00");

  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()+1]} ${d.getFullYear()}`;
}

    const rows = s.type === "nl"
      ? `<ul class="nl">${s.rows.map((r,i)=>`<li><span class="n">${i+1}.</span><span>${esc(r[0])} — ${esc(r[1])}</span></li>`).join("")}</ul>`
      : `<div class="kv-wrap">${s.rows.map(r=>`<div class="kv"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join("")}</div>`;
    return `<div class="card"><h2 class="info-section-title">${esc(s.title)}</h2>${rows}</div>`;
  }).join("");

  const sorted = CALENDAR.slice().sort((a,b)=>a.date.localeCompare(b.date) || a.type.localeCompare(b.type));
  const today = todayISO();
  // Пункты одного дня — под одним заголовком с датой (sorted уже по дате)
  const byDate = [];
  sorted.forEach(item => {
    const last = byDate[byDate.length - 1];
    if(last && last.date === item.date) last.items.push(item);
    else byDate.push({ date: item.date, items: [item] });
  });
  const calHTML = byDate.map(g => `
      <div class="cal-group">
        <span class="cal-date">${ruDate(g.date)}</span>
        ${g.items.map(item => {
          const { id, date, type, what, details } = item;
          const done = !!state.calCheck[id];
          const typeCls = type === "Ключевая дата" ? "key" : type === "Ежегодно" ? "year" : "podg";
          const expired = date < today && !done;
          return `
        <div class="cal-item ${expired ? 'warn' : ''}">
          <span class="cal-type ${typeCls}">${esc(type)}</span>
          <div class="cal-check ${done?'done':''}">
            <input type="checkbox" data-cal-check="${esc(id)}" ${done?"checked":""}>
            <div class="cal-body">
              <div class="w">${esc(what)}</div>
              <div class="d">${esc(details||"")}</div>
            </div>
          </div>
        </div>`;
        }).join("")}
      </div>`).join("");

  // Долгосрок (15 лет) — генерируем помесячный график 2027–2041 + сводка
  const dolgHTML = buildDolgrosok();

  return `
    <div class="card">
      <h2>Справка</h2>
      <div class="section-note">Правила, льготы и оговорки. Источник — лист «Справка» в План.xlsx.</div>
    </div>
    ${spravkaHTML}
    <div style="height:10px;"></div>
    <div class="card">
      <h2>Календарь действий</h2>
      <div class="section-note">Отмечайте выполненное галочкой. Жёлтым отмечены ключевые даты — их нельзя пропускать. Источник — лист «Календарь действий».</div>
      ${calHTML}
    </div>
    <div style="height:10px;"></div>
    <div class="card">
      <h2>Долгосрок (15 лет)</h2>
      <div class="section-note">Помесячный график взносов, вычетов и господдержки до 2041 года (старт — октябрь 2026, первый год неполный). Источник — лист «Долгосрок (15 лет)».</div>
    </div>
    ${dolgHTML}
    <div style="height:10px;"></div>
    <div class="card">
      <h2>Условия и допущения</h2>
      ${renderDolgConditions()}
    </div>
  `;
}

function buildDolgrosok(){
  // помесячные данные 2026–2040 (15 календарных лет взносов; старт — октябрь
  // 2026, поэтому 2026 — неполный год: взносы только за окт-дек).
  const years = [];
  for(let y = 2026; y <= 2040; y++){
    const rows = [];
    for(let m = 1; m <= 12; m++){
      const active = y !== 2026 || m >= 10; // до октября 2026 плана ещё не было
      const IIS = !active ? 0 : (y <= 2035 ? 27350 : 33350);
      const PDS = !active ? 0 : (y <= 2035 ? 6000 : 0);
      const help = (y>=2027 && y<=2036 && m===8) ? (y===2027 ? 9000 : 36000) : 0; // софинансирование за прошлый год — в августе
      const vychet = (y>=2027 && y<=2040 && m===4) ? (y===2027 ? 13007 : 52000) : 0; // возврат НДФЛ — в апреле
      let note = "";
      if(m===12 && y<=2040) note = ">>> 20 декабря: сверить, что взносы ИИС+ПДС за год = 400 000 ₽" + (y===2026 ? " (за неполный год — ≈100 050 ₽, это нормально)" : "");
      if(y===2027 && m===4) note = "Возврат НДФЛ за 2026 г. (13% от ≈100 050 ₽ — неполный год)";
      else if(y>2027 && m===4) note = `Возврат НДФЛ за ${y-1} г. (13% от 400 000 ₽)`;
      if(m===8 && help) note = `Софинансирование за ${y-1} г. (взнос ${y===2027 ? "18 000" : "72 000"} ₽ × коэф. 1:2)`;
      rows.push({y, m, IIS, PDS, help, vychet, note});
    }
    years.push({ y, rows });
  }

  return years.map(yr => {
    const yrSum = {
      IIS: yr.rows.reduce((s,r)=>s+r.IIS,0),
      PDS: yr.rows.reduce((s,r)=>s+r.PDS,0),
      help: yr.rows.reduce((s,r)=>s+r.help,0),
      vychet: yr.rows.reduce((s,r)=>s+r.vychet,0),
    };
    const rowsHTML = yr.rows.map(r => `
      <div class="lg-grid">
        <div class="rv">${MONTHS_RU[r.m-1].slice(0,3)}</div>
        <div class="rv p">${r.PDS ? fmt(r.PDS) : "—"}</div>
        <div class="rv i">${r.help ? fmt(r.help) : "—"}</div>
        <div class="rv i">${fmt(r.IIS)}</div>
        <div class="rv ${r.vychet?'pos':''}">${r.vychet ? fmt(r.vychet) : "—"}</div>
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      </div>`).join("");
    return `
      <div class="card">
        <div class="year-head" data-year-toggle>
          <span>${yr.y}</span>
          <span class="sum">ИИС ${fmt(yrSum.IIS)} · ПДС ${fmt(yrSum.PDS)}${yrSum.help?` · гос ${fmt(yrSum.help)}`:""}</span>
        </div>
        <div class="lg-grid">
          <div class="hd">Месяц</div><div class="hd">ПДС</div><div class="hd">Гос</div><div class="hd">ИИС</div><div class="hd">Вычет</div>
        </div>
        <div class="year-body hidden">${rowsHTML}</div>
      </div>`;
  }).join("");
}
