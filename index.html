<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="theme-color" content="#0F2647">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Бюджет</title>
<!-- График — Chart.js через CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* ==== ТОЧНОЕ ОФОРМЛЕНИЕ ТЕКУЩЕЙ ВЕРСИИ (без изменений) ==== */
  :root{
    --navy-deep:#0B1D33;
    --navy:#13294B;
    --navy-card:#16315A;
    --line:#274571;
    --gold:#D4AF6A;
    --mint:#5FC9B6;
    --coral:#E08D6E;
    --sage:#8FAE9B;
    --text:#EDEFF3;
    --text-dim:#9AAAC4;
    --danger:#E05C5C;
    --good:#5FC97A;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--navy-deep); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    overscroll-behavior-y:none; height:100%; overflow-x:hidden;}
  body{display:flex; flex-direction:column; height:100vh; width:100%; max-width:100%;}
  .topbar{
    padding-top:calc(env(safe-area-inset-top,0px) + 16px);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px 18px;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{margin:0; font-size:20px; font-weight:700; letter-spacing:.2px;}
  .topbar .sub{font-size:12.5px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  main{flex:1; overflow-y:auto; overflow-x:hidden; min-width:0; width:100%; padding:14px 14px calc(86px + env(safe-area-inset-bottom,0px)) 14px;}
  .card{
    background:var(--navy-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .card h2{margin:0 0 10px 0; font-size:14.5px; font-weight:700; color:var(--gold); letter-spacing:.3px;
    text-transform:uppercase;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,0.05); gap:10px;}
  .row:last-child{border-bottom:none;}
  .row .label{font-size:14px; color:var(--text-dim); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .value{font-size:15.5px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .value.neg{color:var(--danger);}
  .value.pos{color:var(--good);}
  .big-stat{display:flex; flex-direction:column; gap:2px; margin-bottom:6px;}
  .big-stat .num{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
  .big-stat .cap{font-size:12px; color:var(--text-dim);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mini{background:var(--navy); border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0;}
  .mini .num{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; word-break:break-word;}
  .mini .cap{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  input[type=text], input[type=number], input[type=date]{
    background:var(--navy); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:15px; width:100%;
    font-family:inherit;
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  input[disabled]{opacity:.55;}
  .pct-input{width:74px !important; text-align:right; flex:0 0 74px !important;}
  label.field{display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--gold); color:#1A1404; font-weight:700; font-size:14.5px;
    border:none; border-radius:12px; padding:12px 16px; width:100%;
    cursor:pointer; -webkit-appearance:none;
  }
  .btn.secondary{background:transparent; color:var(--gold); border:1px solid var(--gold);}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}

  .cat-row{display:flex; flex-direction:column; gap:7px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .title-row{width:100%; min-width:0;}
  .cat-row .meta-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .cat-row .meta-left{flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cat-row .meta-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .cat-row .comment{font-size:11px; color:var(--text-dim); line-height:1.35;}
  .cat-row .amount{font-size:13px; color:var(--mint); font-weight:700; min-width:74px; text-align:right; flex:0 0 auto;}

  /* --- бегущая строка для длинных названий --- */
  .marquee{ overflow:hidden; white-space:nowrap; position:relative; flex:1 1 auto; min-width:0; width:100%; }
  .marquee-track{ display:inline-flex; will-change:transform; min-width:100%; }
  .marquee-track span{ display:inline-block; white-space:nowrap; padding-right:28px; font-size:14.5px; font-weight:600;}
  .marquee.static .marquee-track{ transform:none !important; animation:none !important; }
  .marquee.static .marquee-track span:nth-child(2){ display:none; }
  @keyframes marquee-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .marquee.scrolling .marquee-track{ animation:marquee-scroll linear infinite; }

  /* Размер текста бегущей строки в разных местах */
  .tree-line .tname .marquee-track span{font-size:13.5px; font-weight:600;}
  .tree-line.container .tname .marquee-track span{font-size:13.5px; font-weight:800;}
  .cat-name .marquee-track span{font-size:13px; font-weight:600;}
  .set-row .s-name .marquee-track span{font-size:13.5px; font-weight:600;}
  .income-item .month .marquee-track span{font-size:14px; font-weight:600; color:var(--text-dim);}

  .tag{display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; margin-top:4px;}
  .tag.safe{background:rgba(95,201,182,.15); color:var(--mint);}
  .tag.metal{background:rgba(212,175,106,.15); color:var(--gold);}
  .tag.aggr{background:rgba(224,141,110,.15); color:var(--coral);}
  .tag.gray{background:rgba(154,170,196,.15); color:var(--text-dim);}
  .warn{font-size:12.5px; color:var(--danger); margin-top:8px;}
  .ok{font-size:12.5px; color:var(--good); margin-top:8px;}
  .income-item{display:flex; justify-content:space-between; align-items:center; padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);}
  .income-item:last-child{border-bottom:none;}
  .income-item .month{font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .income-item .amt{font-weight:700; font-variant-numeric:tabular-nums;}
  .income-item .del{color:var(--text-dim); font-size:18px; padding:2px 8px; cursor:pointer;}
  .add-income{display:flex; gap:8px; margin-top:10px;}
  .add-income input{flex:1;}
  .add-income .btn{flex:1; width:auto;}
  .flow{display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; color:var(--text-dim);}
  .flow .arrow{color:var(--gold); font-size:16px;}
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--navy); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;
    z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; padding:6px 0; font-family:inherit;
  }
  nav.tabbar button .ic{font-size:19px; line-height:1;}
  nav.tabbar button.active{color:var(--gold);}
  .view{display:none;}
  .view.active{display:block;}
  .empty{text-align:center; padding:30px 10px; color:var(--text-dim); font-size:13.5px;}
  .section-note{font-size:12px; color:var(--text-dim); margin:-4px 0 12px 0; line-height:1.5;}
  .check-banner{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; font-size:13px; margin-top:6px;}
  .check-banner.good{background:rgba(95,201,122,.12); color:var(--good);}
  .check-banner.bad{background:rgba(224,92,92,.12); color:var(--danger);}
  .lock-note{font-size:11px; color:var(--text-dim); margin-top:2px;}

  /* ==== ДОБАВЛЕНО ДЛЯ НОВЫХ ЭКРАНОВ ==== */

  /* Кнопка «Добавить доход» — крупная */
  .btn-big{font-size:17px; padding:16px; border-radius:14px;}
  .btn-big .plus{font-size:22px; line-height:1;}

  /* Контейнер графика */
  .chart-wrap{position:relative; width:100%; max-width:360px; margin:8px auto 4px auto;}
  .chart-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center; padding:0 20px;}
  .chart-center .v{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chart-center .c{font-size:11px; color:var(--text-dim);}

  /* Легенда (список распределения) под диаграммой */
  .legend{display:flex; flex-direction:column; gap:6px; margin-top:14px;}
  .legend .lg{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .legend .sw{width:12px; height:12px; border-radius:3px; flex:0 0 auto;}
  .legend .lg .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend .lg .vv{color:var(--text-dim); font-variant-numeric:tabular-nums;}

  /* Иерархия распределения (дерево) */
  .tree-line{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05);}
  .tree-line:last-child{border-bottom:none;}
  .tree-line .tname{flex:1; min-width:0; font-size:13.5px; display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tree-line .tname .cnt{color:var(--mint); font-size:11px; opacity:.9;}
  .tree-line .tamount{font-size:14px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .tree-line .tamount .pct{font-size:11px; color:var(--text-dim); font-weight:600;}
  .tree-line.container .tname{font-weight:800; color:var(--gold);}
  .tree-line.container .tamount{color:var(--gold);}
  /* Три строки-контейнера («Доход», «Остаток», «Свободный остаток»):
     названия слева, суммы — по центру отведённой колонки */
  .tree-line.tree-line-c .tname{flex:0 0 58%;}
  .tree-line.tree-line-c .tamount{flex:1; text-align:center;}
  .indent-0{padding-left:0;} .indent-1{padding-left:16px;} .indent-2{padding-left:32px;} .indent-3{padding-left:48px;}

  /* Настройки: ползунки и ряды категорий */
  .set-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); flex-wrap:wrap;}
  .set-row:last-child{border-bottom:none;}
  .set-row .s-name{flex:1; min-width:140px; font-size:13.5px;}
  .set-row .s-name small{display:block; color:var(--text-dim); font-size:11px; font-weight:400;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:0 0 auto;}
  .seg button{background:none; border:none; color:var(--text-dim); padding:7px 12px; font-size:12px; font-family:inherit; cursor:pointer;}
  .seg button.active{background:var(--gold); color:#1A1404; font-weight:700;}

  /* Добавить категорию */
  .form-field{margin-bottom:10px;}
  .form-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .form-grid > *{flex:1; min-width:120px;}

  /* Информация */
  .info-section-title{font-size:14px; font-weight:800; color:var(--gold); text-transform:none; letter-spacing:.2px;}
  .kv{display:flex; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; line-height:1.45;}
  .kv:last-child{border-bottom:none;}
  .kv .k{flex:0 0 118px; color:var(--gold); font-weight:700; font-size:12.5px;}
  .kv .v{flex:1; color:var(--text); min-width:0;}
  .kv.tight .k{flex-basis:92px;}
  .nl{list-style:none; margin:0; padding:0;}
  .nl li{display:flex; gap:8px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px; line-height:1.45;}
  .nl li:last-child{border-bottom:none;}
  .nl .n{color:var(--gold); font-weight:700; flex:0 0 18px; text-align:right;}

  /* Календарь действий */
  .cal-group{padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.08);}
  .cal-group:last-child{border-bottom:none;}
  .cal-date{font-size:12px; color:var(--mint); font-weight:700; display:block; margin-bottom:3px;}
  .cal-type{display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px; margin-bottom:5px; font-weight:700;}
  .cal-type.podg{background:rgba(154,170,196,.15); color:var(--text-dim);}
  .cal-type.year{background:rgba(95,201,182,.15); color:var(--mint);}
  .cal-type.key{background:rgba(224,92,92,.2); color:var(--danger);}
  .cal-check{display:flex; align-items:flex-start; gap:10px; margin-top:6px;}
  .cal-check input{width:auto; margin-top:2px; flex:0 0 auto;}
  .cal-body{flex:1;}
  .cal-body .w{font-size:13.5px; font-weight:600; margin-bottom:2px;}
  .cal-body .d{font-size:12px; color:var(--text-dim); line-height:1.4;}
  .cal-check.done .cal-body{opacity:.45;}
  .cal-check.done .w{text-decoration:line-through;}

  /* Долгосрок */
  .year-head{display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:none;
    color:var(--gold); font-family:inherit; font-size:14px; font-weight:800; padding:10px 0; cursor:pointer; letter-spacing:.3px;}
  .year-head .sum{color:var(--text-dim); font-size:11.5px; font-weight:600;}
  .lg-grid{display:grid; grid-template-columns:58px 1fr 1fr 1fr 1fr; gap:4px 8px; font-size:11.5px; padding:4px 0;}
  .lg-grid .hd{color:var(--gold); font-weight:700; font-size:10.5px;}
  .lg-grid .rv{font-variant-numeric:tabular-nums; color:var(--text-dim);}
  .lg-grid .rv.p{color:var(--mint);}
  .lg-grid .rv.i{color:var(--gold);}
  .lg-grid .note{grid-column:1 / -1; color:var(--text-dim); font-size:10.5px; padding-top:2px;}

  /* Подсказка установки PWA */
  .a2hs{position:fixed; left:10px; right:10px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:9;
    background:var(--navy-card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px; box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .a2hs .txt{flex:1; font-size:12.5px; line-height:1.35;}
  .a2hs button{background:none; border:none; color:var(--gold); font-weight:700; font-size:12px; font-family:inherit; cursor:pointer; padding:4px 6px;}
  .a2hs button.x{color:var(--text-dim); font-size:16px;}
  .a2hs.hidden{display:none;}

  /* Баннер «есть долги» */
  .debt-banner{background:rgba(224,92,92,.12); border:1px solid rgba(224,92,92,.4); color:var(--danger);
    border-radius:var(--radius); padding:14px 16px; font-size:13px; line-height:1.45; margin-bottom:12px;}

  /* ===== НОВОЕ: главная (1.1–1.4) ===== */

  /* Селектор месяца/года на главной */
  .period-row{display:flex; gap:8px; margin-top:4px;}
  .period-select{flex:1; background:var(--navy); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px; font-size:14px; font-family:inherit;}

  /* Три строки-контейнера («Доход», «Остаток», «Свободный остаток») с переключаемым типом */
  .locked-row{background:var(--navy-card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin:0 0 6px 0;}
  .locked-row .k2{font-size:12px; color:var(--text-dim); font-weight:400;}
  .locked-row .v2{font-size:15px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums;}
  .switch2{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:0 0 auto;}
  .switch2 button{background:none; border:none; color:var(--text-dim); padding:6px 10px; font-size:11px; font-family:inherit; cursor:pointer;}
  .switch2 button.active{background:var(--gold); color:#1A1404; font-weight:700;}

  /* ===== НОВОЕ: настройки (3.1–3.4) ===== */

  /* Статичное предупреждение о долгах (вместо чекбокса) */
  .debt-notice{background:rgba(224,92,92,.12); border:1px solid rgba(224,92,92,.4); color:var(--danger);
    border-radius:var(--radius); padding:12px 34px 12px 16px; font-size:13px; line-height:1.45; position:relative;}
  .debt-close{position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%;
    border:none; background:rgba(224,92,92,.18); color:var(--danger); font-size:13px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .debt-close:hover{background:rgba(224,92,92,.35); color:#fff;}

  /* Напоминание на главной: заходить минимум 1 раз 27 числа */
  .reminder{background:rgba(212,175,106,.09); border:1px solid rgba(212,175,106,.35); color:var(--gold);
    border-radius:var(--radius); padding:13px 16px; font-size:13px; line-height:1.5; margin-top:14px;}

  /* Категории, сгруппированные по уровням — каждый уровень отдельным блоком */
  .cat-level{margin:0 0 14px 0; background:rgba(255,255,255,0.03);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
  .cat-level-title{font-size:13px; font-weight:800; color:var(--gold); margin-bottom:2px;}
  .cat-level-note{font-size:11.5px; color:var(--text-dim); margin-bottom:8px;}
  .cat-level-base{font-size:12px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums;
    background:rgba(212,175,106,.12); border:1px solid rgba(212,175,106,.35); border-radius:8px;
    padding:6px 10px; margin-bottom:8px;}
  .cat-level-base .bs{color:var(--gold);}
  .cat-level-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.05); flex-wrap:wrap; min-width:0;}
  .cat-level-row:last-child{border-bottom:none;}
  .cat-level-row .cat-left{flex:1; min-width:150px; max-width:100%;}
  .cat-name{font-size:13.5px; display:flex; align-items:center; gap:6px; min-width:0;}
  .cat-edit{background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1;flex:0 0 auto;}
  .cat-edit:hover{color:var(--gold);background:rgba(255,255,255,.06);}
  .cat-name-inp{font-size:13px;font-family:inherit;background:var(--navy);border:1px solid var(--gold);color:var(--text);border-radius:6px;padding:3px 7px;width:140px;max-width:100%;min-width:0;outline:none;}
  .cat-desc{font-size:11px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .cat-level-row .cat-right{display:flex; align-items:center; gap:8px; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end; min-width:0; max-width:100%;}
  .cat-inp{width:104px; max-width:40vw; min-width:0; background:var(--navy); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:13px; text-align:right; font-variant-numeric:tabular-nums; outline:none;}
  .cat-inp:focus{border-color:var(--gold);}
  .cat-inp.over, .cat-level-row .amount.over{color:#FF6B6B; border-color:#FF6B6B; background:rgba(255,107,107,.08);}
  /* Заметки уровня категорий: предупреждение и ошибка */
  .lvl-note{font-size:11.5px; line-height:1.45; padding:7px 10px; border-radius:9px; margin:2px 0 10px;}

<script>
"use strict";
/* =====================================================================
   ЛОГИКА ФИНАНСОВОГО PWA-ПРИЛОЖЕНИЯ «БЮДЖЕТ»
   Иерархическое распределение ЗП; данные — в LocalStorage;
   экспорт/импорт JSON; офлайн через Service Worker.
   ===================================================================== */

const STORAGE_KEY = "budget_app_v4";

/* ---------- состояние по умолчанию ---------- */
function defaultState(){
  return {
    storageVersion: "budget_app_v4",
    hasDebts: false,          // «приложение работает только при отсутствии кредитов и долгов»
    hideDebtNotice: false,    // пользователь закрыл предупреждение о долгах (крестиком) — больше не показываем
    salary: 90000,            // текущая ЗП (100%)
    tree: defaultTree(),      // иерархия категорий
    incomes: [],              // история доходов: {date, amount, comment}
    calCheck: {},             // отметки «Сделано» в календаре действий (ключ = дата|текст)
    ui: { theme: "dark" },    // настройки UI (в текущем дизайне тема только тёмная)
  };
}

/* Дерево распределения по умолчанию (см. ТЗ):
   ЗП(100%)
   ├─ Благотворительность: 1% от ЗП
   ├─ ИИС: фикс 27 350
   ├─ ПДС: фикс 6 000
   └─ Остаток (= 100% для уровня)
      ├─ На жизнь: 70% от остатка
      └─ Свободный остаток: остаток (всё, что не ушло выше) (=100%)
         ├─ Подушка безопасности: 30%
         └─ Агрессивные накопления: 70%
   kind: root/ base/ pct / fixed
   base-узел (контейнер): если есть value — берёт % от родителя; иначе — остаток.
*/
let uidSeq = 1;
function defaultTree(){
  return {
    uid: "root", kind: "root", name: "Зарплата", custom: false,
    children: [
      { uid: "b1", kind: "pct",   value: 1,     name: "Благотворительность", custom: false },
      { uid: "b2", kind: "fixed", value: 27350, name: "ИИС", custom: false },
      { uid: "b3", kind: "fixed", value: 6000,  name: "ПДС", custom: false },
      { uid: "b4", kind: "base",  value: null,  name: "Остаток", custom: false, children: [
        { uid: "b5", kind: "pct", value: 70, name: "На жизнь", custom: false },
        { uid: "b6", kind: "base", value: null, name: "Свободный остаток", custom: false, children: [
          { uid: "b7", kind: "pct", value: 30, name: "Подушка безопасности", custom: false },
          { uid: "b8", kind: "pct", value: 70, name: "Агрессивные накопления", custom: false },
        ]},
      ]},
    ]
  };
}

/* ---------- загрузка / сохранение в LocalStorage ---------- */
let state = load();

/* Миграция старых сохранений:
   «Свободный остаток» стал контейнером-остатком (value: null) — он забирает
   всё, что не раздали на уровне 2 (если раздали 60% → уходит 40%). */
function migrateTree(t){
  if(!t) return;
  const hit = findNode(t, "b6");
  const b6 = hit && hit.node;
  if(b6 && b6.kind === "base" && b6.value === 30) b6.value = null;
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    if(parsed && parsed.tree && parsed.tree.kind) base.tree = parsed.tree;
    const res = Object.assign(base, parsed);
    migrateTree(res.tree);
    return res;
  }catch(e){ return defaultState(); }
}

// Автосохранение после каждого изменения
function cleanTree(n){
  const c = {};
  for(const k in n){
    if(k === "amount" || k === "pctOfSalary" || k === "_depth" || k === "childBase" || k === "_income") continue;
    c[k] = n[k];
  }
  if(Array.isArray(n.children)) c.children = n.children.map(cleanTree);
  return c;
}

// В state.tree после каждого рендера остаются ВЫЧИСЛЕННЫЕ поля
// (amount, pctOfSalary, _depth, childBase, _income). В LocalStorage и в
// экспортируемый JSON они не попадают — в хранилище кладётся чистое дерево.
function snapState(){ return {...state, tree: cleanTree(state.tree)}; }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(snapState())); render(); }

/* ---------- форматирование ---------- */
function n2(v){ return (isFinite(v) && v!==null) ? v : 0; }
// Округление денег до копейки (2 знака) — вся иерархия считает копейками.
function round2(v){ return Math.round(n2(v) * 100) / 100; }
// Показываем копейки, только если они есть (иначе целые рубли).
function fmt(n){
  n = round2(n);
  if(n % 1 === 0) return n.toLocaleString('ru-RU', {maximumFractionDigits:0}) + " ₽";
  return n.toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2}) + " ₽";
}
function pctFmt(p){ return Math.round(n2(p)*10)/10 + "%"; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Бегущая строка: дублируем текст, анимация сдвига на -50%.
   setupMarquees() измеряет ширину и включает прокрутку, только если текст не влезает. */
function mq(html){
  return `<div class="marquee"><div class="marquee-track"><span>${html}</span><span>${html}</span></div></div>`;
}

/* ---------- РАСЧЁТ ДЕРЕВА ----------
   Рекурсивно заполняет у каждого узла node.amount и node.pctOfSalary.
   Возвращает корневой узел.
   Основание расчёта (корень) — доход за выбранный месяц/год (см. вывод месяца
   в блоке «Доход за месяц»). Если записей нет — берётся сохранённая СУММА. */
function computeTree(){
  const root = state.tree;
  const inc = getSelectedIncome();
  // inc.total уже корректен: при отсутствии записей это сохранённая сумма,
  // иначе — сумма за выбранный период (может быть 0, если месяц/год пустые).
  const baseAmount = round2(n2(inc.total));
  walk(root, baseAmount, 0);
  // Проценты — доля от фактического основания (доход за выбранный период),
  // а не от сохранённой суммы: показываем реальную долю в распределении.
  const rootAmt = n2(root.amount);
  (function setPct(n){
    (n.children||[]).forEach(ch=>{ setPct(ch); });
    n.pctOfSalary = rootAmt>0 ? (n2(n.amount)/rootAmt)*100 : 0;
  })(root);
  root._income = inc;
  return root;
}

/* ---------- выбор месяца/года на главной ----------
   Временный выбор НЕ сохраняется: при перезагрузке страницы снова берётся
   месяц последней записи. В пределах сеанса выбор запоминается в памяти. */
let selMonth = null; // 1..12
let selYear = null;

// Месяц/год последней записи в доходах (или null, если записей нет).
// Берём самый поздний период ПО ДАТЕ, а не последний добавленный в список:
// записи могут добавляться вразнобой, и последний элемент массива не значит
// самый свежий. После обновления страницы должен выбираться максимальный месяц/год.
function lastIncomePeriod(){
  const inc = state.incomes;
  if(!inc.length) return null;
  let best = null;
  inc.forEach(i => {
    if(!i || !i.date) return;
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return;
    const y = d.getFullYear(), m = d.getMonth()+1;
    if(!best || y > best.year || (y === best.year && m > best.month)){
      best = { month: m, year: y };
    }
  });
  return best;
}

// Последняя ЗАПИСЬ по дате (а не последняя добавленная в массив),
// чтобы подзаголовок совпадал с периодом, выбранным на главной.
function latestIncome(){
  let best = null;
  (state.incomes||[]).forEach(i => {
    if(!i || !i.date) return;
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return;
    if(!best || d.getTime() > new Date(best.date + "T00:00:00").getTime()) best = i;
  });
  return best;
}

// Сумма всех поступлений за указанный месяц/год
function incomeByPeriod(month, year){
  return state.incomes.reduce((s,i)=>{
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return s;
    if(d.getMonth()+1 === month && d.getFullYear() === year) return s + n2(i.amount);
    return s;
  }, 0);
}

// Актуальный выбранный период и сумма по нему
function getSelectedIncome(){
  const lp = lastIncomePeriod();
  if(!lp){ return { month: null, year: null, total: round2(state.salary) }; }
  // при первом обращении берём месяц последней записи
  if(selMonth === null){ selMonth = lp.month; selYear = lp.year; }
  return { month: selMonth, year: selYear, total: round2(incomeByPeriod(selMonth, selYear)) };
}

// Процент с ОДНИМ знаком: 12 → "12%", 30.4 → "30.4%"
function pct1(p){
  const v = Math.round(n2(p)*10)/10;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + "%";
}

// Русские названия месяцев (для заголовка и подписи)
const MONTHS_GEN = ["","января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_NOM = ["","Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
// Названия месяцев для селектора (сокращённо, для компактности)
const MONTHS_SHORT = ["","янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function walk(node, base, depth){
  node._depth = depth;
  if(node.kind === "fixed"){ node.amount = round2(node.value); node.childBase = null; return node.amount; }
  if(node.kind === "pct"){ node.amount = round2(base * (n2(node.value)/100)); node.childBase = null; return node.amount; }
  // контейнер (root / base): считаем его бюджет в копейках
  const baseAmt = (node.value != null && node.kind === "base") ? round2(base * (n2(node.value)/100)) : round2(base);
  node.amount = baseAmt;
  // 1) распределяем pct- и fixed-детей (каждый округляется до копейки)
  let sumKids = 0;
  (node.children||[]).forEach(ch => {
    if(ch.kind === "pct" || ch.kind === "fixed") sumKids += walk(ch, baseAmt, depth+1);
  });
  // 2) base-дети с явным процентом
  (node.children||[]).forEach(ch => { if(ch.kind === "base" && ch.value != null) sumKids += walk(ch, baseAmt, depth+1); });
  // 3) base-ребёнок без процента — получает ровно остаток (сумма всегда сходится)
  const remChild = (node.children||[]).find(ch => ch.kind === "base" && ch.value == null);
  if(remChild){
    const rem = Math.max(0, round2(baseAmt - sumKids));
    sumKids += walk(remChild, rem, depth+1);
  } else if(sumKids > 0){
    // Остаточного контейнера нет: докручиваем детей, чтобы их сумма в копейках
    // РОВНО равнялась бюджету (иначе на 70/30 → 30/70 накапливается копеечная ошибка).
    balanceKids(node, baseAmt, sumKids);
  }
  return node.amount;
}

// Корректировка: распределяет разницу в копейках по процентным детям контейнера,
// чтобы сумма детей точно совпала с бюджетом уровня.
function balanceKids(parent, target, sum){
  const diffK = Math.round(target*100) - Math.round(sum*100);
  if(diffK === 0) return;
  const parts = (parent.children||[]).filter(ch => ch.kind==="pct" || (ch.kind==="base" && ch.value != null));
  if(!parts.length) return;
  const sign = diffK > 0 ? 1 : -1;
  const n = Math.abs(diffK);
  for(let i=0; i<n; i++){
    // распределяем по кругу среди процентных детей
    const part = parts[i % parts.length];
    part.amount = round2(n2(part.amount) + sign*0.01);
  }
}

/* Плоский список всех узлов дерева (в порядке обхода) — для отображения иерархии */
function flatten(node, arr){
  arr = arr || [];
  arr.push(node);
  (node.children||[]).forEach(c => flatten(c, arr));
  return arr;
}

/* Только листовые категории (что идёт в график) */
function leaves(node, arr){
  arr = arr || [];
  (node.children||[]).forEach(ch => {
    if(ch.kind === "pct" || ch.kind === "fixed") arr.push(ch);
    else leaves(ch, arr);
  });
  return arr;
}

/* Найти узел по uid, [опционально] вернуть родителя */
function findNode(node, uid, parent){
  if(node.uid === uid) return { node, parent };
  for(const c of (node.children||[])){
    const r = findNode(c, uid, node);
    if(r) return r;
  }
  return null;
}
function findParentOf(node, uid, parent){
  if((node.children||[]).some(c => c.uid === uid)) return node;
  for(const c of (node.children||[])){
    const r = findParentOf(c, uid, node);
    if(r) return r;
  }
  return null;
}

/* Уровни вложенности для пользовательских категорий */
const LEVELS = [
  { id: "root", label: "Уровень 1 — от всего дохода", containerUid: "root", isBase: false },
  { id: "ost",  label: "Уровень 2 — от Остатка", containerUid: "b4", isBase: true },
  { id: "svob", label: "Уровень 3 — от Свободного остатка", containerUid: "b6", isBase: true },
];

function containerByLevel(levelId){
  const L = LEVELS.find(l => l.id === levelId);
  if(!L) return { parent: findNode(state.tree, "root").node, isBase: false };
  if(L.containerUid === "root") return { parent: state.tree, isBase: false };
  const p = findNode(state.tree, L.containerUid);
  return { parent: p.node, isBase: L.isBase };
}

function freshUid(){
  return "c" + (uidSeq++) + "_" + Math.random().toString(36).slice(2,7);
}

/* ---------- главная навигация ---------- */
let activeView = "home";

function setActiveView(v){
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  activeView = v;
  render();
  const main = document.getElementById("main");
  main.scrollTop = 0;
}

/* ---------- рендер ---------- */
function render(){
  const root = computeTree();
  const inc = root._income;
  const totalAll = state.incomes.reduce((s,i)=>s+n2(i.amount),0);
  const lastInc = latestIncome();
  document.getElementById("topSub").textContent =
    lastInc
      ? `ЗП: ${fmt(lastInc.amount)} последняя · Всего доходов: ${fmt(totalAll)}`
      : `Доходов пока нет`;

  document.querySelectorAll("main .view").forEach(v => v.remove());
  const main = document.getElementById("main");
  const view = document.createElement("div");
  view.className = "view active";
  view.id = "view-"+activeView;

  if(activeView === "home") view.innerHTML = renderHome(root);
  if(activeView === "incomes") view.innerHTML = renderIncomes();
  if(activeView === "settings") view.innerHTML = renderSettings(root);
  if(activeView === "info") view.innerHTML = renderInfo();

  main.appendChild(view);
  bindEvents();
  setupMarquees(view);
  if(activeView === "home") drawChart();
}

/* ================= ЭКРАН «ГЛАВНАЯ» ================= */
function renderHome(root){
  const all = flatten(root);
  const inc = root._income;
  const total = inc.total;               // доход за выбранный период
  const floor = Math.max(0, n2(total));

  // Доступные месяцы/годы для селектора — из истории доходов
  const avail = {};
  state.incomes.forEach(i => {
    const d = new Date(i.date + "T00:00:00");
    if(isNaN(d)) return;
    avail[d.getFullYear()] = 1;
  });
  const years = Object.keys(avail).map(Number).sort((a,b)=>a-b);
  const selY = inc.year !== null ? inc.year : (years.length ? years[years.length-1] : new Date().getFullYear());
  const monthOpts = MONTHS_NOM.map((mn, m) => m===0 ? "" : `<option value="${m}" ${inc.month===m ? "selected":""}>${mn}</option>`).join("");
  const yearOpts = years.length
    ? years.map(y => `<option value="${y}" ${selY===y ? "selected":""}>${y}</option>`).join("")
    : "".concat(`<option value="${new Date().getFullYear()}">${new Date().getFullYear()}</option>`);

  // Переключатель месяца и года (временный, не сохраняется)
  const periodCtrl = `
    <div class="period-row">
      <select id="selMonth" class="period-select">${monthOpts}</select>
      <select id="selYear" class="period-select">${yearOpts}</select>
    </div>`;

  // Заголовок суммы: «Доход за сентябрь 2026 г.»
  const title = inc.month ? `Доход за ${MONTHS_NOM[inc.month].toLowerCase()} ${selY} г.` : "Доход не выбран";

  // Дерево распределения: два столбца (название слева, значение справа).
  // У контейнеров («Доход», «Остаток», «Свободный остаток») значение по центру колонки.
  const treeHTML = all.map(node => {
    const isContainer = (node.kind==="root"||node.kind==="base");
    const cls = isContainer ? "container" : "";
    // Название корня — «Доход» (вместо «Зарплата»)
    const name = node.uid === "root" ? "Доход" : node.name;
    const tag = node.kind==="fixed" ? '<span class="tag gray">фикс</span>'
              : node.kind==="pct" ? '<span class="tag safe">%</span>' : "";
    const cnt = node.custom ? `<span class="cnt">[своя]</span>` : "";
    // Проценты без приписки «от ЗП» — только число со знаком %: 12%
    const pctTxt = isContainer ? "" : `<span class="pct"> · ${pct1(node.pctOfSalary)}</span>`;
    // Все строки — одним списком без отступов: названия слева, значения по колонкам.
    // Длинные названия — бегущей строкой (mq), чтобы ничего не вылезало за экран.
    const myIndent = 0;

/* ---------- график (donut) ----------
   Сектора без стрелочек и подписей: детали видны при наведении (tooltip)
   и в списке под диаграммой. Процент — всегда с ОДНИМ знаком «%»: 12%, 30.4%.
*/
let chart = null;
const CHART_COLORS = ["#D4AF6A","#5FC9B6","#E08D6E","#8FAE9B","#7BA7D6","#C79AE0","#E0B06E","#6EC8A5","#E08D9B","#9AAAC4"];

function drawChart(){
  const canvas = document.getElementById("distChart");
  if(!canvas) return;
  const items = leaves(state.tree).filter(l => n2(l.amount) > 0);
  const root = state.tree;
  const total = n2(root._income && root._income.total);

  // Список под диаграммой: цвет · название · сумма · процент (один знак %)
  const legend = document.getElementById("distLegend");
  if(legend){
    legend.innerHTML = items.map((it, i) => `
      <div class="lg">
        <span class="sw" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>
        <span class="nm">${esc(it.name)}</span>
        <span class="vv">${fmt(it.amount)} · ${pct1(it.pctOfSalary)}</span>
      </div>`).join("");
  }

  if(chart) chart.destroy();
  if(typeof Chart === "undefined"){
    // Chart.js не загрузился (например, первый запуск без интернета):
    // легенда и суммы уже отрисованы выше — просто пропускаем диаграмму.
    chart = null;
    return;
  }
  if(!items.length){
    chart = null;
    return;
  }
  chart = new Chart(canvas.getContext("2d"), {
    type: "doughnut",
    data: {
      labels: items.map(i => i.name),
      datasets: [{
        data: items.map(i => n2(i.amount)),
        backgroundColor: items.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]),
        borderColor: "#16315A",
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: "58%",
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const val = ctx.parsed;
              const pct = total>0 ? (val/total*100) : 0;
              return ` ${fmt(val)} · ${pct1(pct)}`;    // один знак «%»
            }
          }
        }
      }
    },
    plugins: {}
  });
}

/* ================= ЭКРАН «НАСТРОЙКИ» ================= */
// Сообщение о заблокированном изменении (проценты уровня > 100%)
let guardMsg = null;
// Временный черновик формы «Пользовательские категории», чтобы при блокировке
// (render без сохранения) введённые данные не пропадали.
let customDraft = null;

// Сколько ещё процентов можно вложить в контейнер (уровень), чтобы сумма процентов
// уровня не превысила 100%: учитываем остальные pct-категории и контейнеры,
// у которых задан явный процент (число). Контейнеры-«остатки» (value == null)
// сами собирают остаток и в лимит 100% не входят.
function pctHeadroom(parent, excludeUid){
  const children = parent.children || [];
  const pctSum  = children.filter(c=>c.kind==="pct" && c.uid!==excludeUid).reduce((s,c)=>s+n2(c.value),0);
  const baseSum = children.filter(c=>c.kind==="base" && c.value != null && c.uid!==excludeUid).reduce((s,c)=>s+n2(c.value),0);
  return Math.max(0, 100 - pctSum - baseSum);
}

// Информация об уровнях иерархии (для блока «Категории»)
const CAT_LEVELS = [
  { containerUid: "root", baseName: "Доход", title: "Уровень 1 — от всего дохода",
    baseShort: "всего дохода", baseFull: "доход за выбранный месяц; остаток уходит в «Остаток»" },
  { containerUid: "b4",   baseName: "Остаток", title: "Уровень 2 — от остатка",
    baseShort: "остатка", baseFull: "остаток после благотворительности, ИИС и ПДС; нераспределённое уходит в «Свободный остаток»" },
  { containerUid: "b6",   baseName: "Свободный остаток", title: "Уровень 3 — от свободного остатка",
    baseShort: "свободного остатка", baseFull: "свободный остаток — всё, что осталось после категорий уровня 2" },
];

// Отрисовка одного редактируемого уровня категорий
function renderCatLevel(container, info){
  const kids = (container.children||[]).filter(ch => ch.kind==="pct" || ch.kind==="fixed");
  if(!kids.length) return "";
  // Статистика уровня: сколько занимают проценты, фикс-суммы и контейнеры-проценты
  const base = n2(container.amount);                      // «Основа» уровня
  const pctSum  = kids.filter(k=>k.kind==="pct").reduce((s,k)=>s+n2(k.value),0);
  const fixedSum= kids.filter(k=>k.kind==="fixed").reduce((s,k)=>s+n2(k.value),0);
  const baseSum = (container.children||[]).filter(ch=>ch.kind==="base" && ch.value != null).reduce((s,k)=>s+n2(k.value),0);
  const fixedPct = base>0 ? fixedSum/base*100 : 0;
  const usedPct  = pctSum + fixedPct + baseSum;           // сколько % основания задействовано
  const overAll  = pctSum + baseSum > 100 + 1e-9;         // проценты уровня упёрлись в 100%
  // Есть ли контейнер-«остаток» (value == null): он забирает всё, что не ушло выше,
  // поэтому уровень считается полностью распределённым, и предупреждение не нужно.
  const hasRemainder = (container.children||[]).some(ch => ch.kind==="base" && ch.value == null);
  // Заметка уровня (только для уровней, где распределяются проценты)
  let note = "";
  if(overAll){
    note = `<div class="lvl-note err">⚠ Сумма процентов этого уровня больше 100% — уменьшите проценты.</div>`;
  } else if(!hasRemainder && kids.some(k=>k.kind==="pct") && usedPct < 100 - 1e-9){
    const rem = Math.max(0, base - usedPct/100*base);
    note = `<div class="lvl-note warn">Распределены не все средства: не распределено ≈ ${fmt(rem)} из ${fmt(base)}.</div>`;
  }
  const rows = kids.map(node => {
    const isPct = node.kind === "pct";
    const tag = node.custom ? '<span class="tag gray">своя</span>' : "";
    // Пояснение, от чего считается значение
    const desc = isPct
      ? `${pctFmt(node.value)} от ${info.baseShort}`
      : `фикс ${fmt(node.value)} · от ${info.baseShort}`;
    // Фикс-сумма: красная, если превышает основу уровня (доход за месяц) одна или в сумме
    const overFix = !isPct && (n2(node.value) > base || fixedSum > base);
    const valInput = isPct
      ? `<input type="number" class="cat-inp" data-set-value="${node.uid}" data-kind="pct" value="${n2(node.value)}" step="0.1" min="0"><span class="inp-sfx">%</span>
         <span class="amount">${fmt(node.amount)}</span>`
      : `<input type="number" class="cat-inp${overFix?" over":""}" data-set-value="${node.uid}" data-kind="fixed" value="${n2(node.value)}" step="1" min="0" inputmode="decimal"><span class="inp-sfx">₽</span>
         <span class="amount${overFix?" over":""}">${fmt(node.amount)}</span>`;
    return `
      <div class="cat-level-row">
        <div class="cat-left">
          <div class="cat-name">${mq(tag + esc(node.name))}<button type="button" class="cat-edit" data-edit-name="${node.uid}" title="Переименовать">✎</button></div>
          <div class="cat-desc">${esc(desc)}</div>
        </div>
        <div class="cat-right">
          <div class="seg" data-seg="${node.uid}">
            <button data-seg-kind="pct" class="${isPct?'active':''}">%</button>
            <button data-seg-kind="fixed" class="${!isPct?'active':''}">₽</button>
          </div>
          ${valInput}
        </div>
      </div>`;
  }).join("");
  // Подзаголовок уровня + база (от чего считаются проценты) + заметка про 100%
  return `
    <div class="cat-level">
      <div class="cat-level-title">${esc(info.title)}</div>
      <div class="cat-level-base">Основа: <span class="bs">${esc(info.baseName)} — ${fmt(n2(container.amount))}</span> · ${esc(info.baseFull)}</div>
      ${note}
      ${rows}
    </div>`;
}

function renderSettings(root){
  // Сообщение о заблокированном изменении (показывается один раз)
  const guard = guardMsg; guardMsg = null;
  // Черновик формы своих категорий (на случай блокировки)
  const draft = customDraft; customDraft = null;
  // редактируемая иерархия категорий — сгруппирована по уровням
  const levelHTML = CAT_LEVELS.map(info => {
    const hit = findNode(state.tree, info.containerUid);
    if(!hit) return "";
    return renderCatLevel(hit.node, info);
  }).join("");

  // пользовательские категории (для управления уровнем/удалением)
  const all = flatten(root);
  const custom = all.filter(n => n.custom && (n.kind==="pct"||n.kind==="fixed"));
  const customRows = custom.map(n => {
    const container = findParentOf(state.tree, n.uid);
    const levelId = LEVELS.find(L => L.containerUid === container.uid) ? LEVELS.find(L => L.containerUid === container.uid).id : "root";
    return `
      <div class="set-row">
        <div class="s-name">${mq(esc(n.name))}<small>${levelId==="root"?"Уровень 1":levelId==="ost"?"Уровень 2":"Уровень 3"} · ${n.kind==="pct" ? pctFmt(n.value) : fmt(n.value)}</small></div>
        <select class="change-level" data-custom-level="${n.uid}">
          <option value="root" ${levelId==="root"?"selected":""}>Ур.1 (Доход)</option>
          <option value="ost" ${levelId==="ost"?"selected":""}>Ур.2 (Остаток)</option>
          <option value="svob" ${levelId==="svob"?"selected":""}>Ур.3 (Своб.ост.)</option>
        </select>
        <button class="btn danger" data-del-custom="${n.uid}" style="width:auto;padding:8px 12px;">Удалить</button>
      </div>`;
  }).join("") || `<div class="lock-note">Пользовательских категорий пока нет.</div>`;

  const levelOpts = LEVELS.map(l => `<option value="${l.id}" ${draft && draft.level === l.id ? "selected":""}>${l.label}</option>`).join("");

  return `
    ${state.hideDebtNotice ? "" : `
      <div class="card">
        <div class="debt-notice">
          ⚠️ Этот финансовый план работает только при отсутствии кредитов и долгов. Если есть долг — сначала закройте его.
          <button type="button" class="debt-close" data-close-debt title="Больше не показывать">✕</button>
        </div>
      </div>`}
    ${guard ? `<div class="card"><div class="lvl-note err">${guard}</div></div>` : ""}

    <div class="card">
      <h2>Категории</h2>
      <div class="section-note">Меняйте % или фиксированную сумму. Все зависимые суммы пересчитаются автоматически.</div>
      ${levelHTML || `<div class="lock-note">Категорий нет.</div>`}
    </div>

    <div class="card">
      <h2>Пользовательские категории</h2>
      <div class="section-note">Добавьте свою категорию и выберите уровень вложенности.</div>
      <label class="field">Название</label>
      <input type="text" id="customName" placeholder="Напр. Отпуск" value="${esc(draft ? draft.name : "")}">
      <div class="form-grid" style="margin-top:8px;">
        <div>
          <label class="field">Уровень</label>
          <select id="customLevel" style="background:var(--navy);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;width:100%;font-size:14px;">${levelOpts}</select>
        </div>
        <div>
          <label class="field">Тип</label>
          <select id="customType" style="background:var(--navy);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;width:100%;font-size:14px;">
            <option value="pct" ${!(draft && draft.type === "fixed") ? "selected":""}>Процент</option>
            <option value="fixed" ${draft && draft.type === "fixed" ? "selected":""}>Фикс. сумма</option>
          </select>
        </div>
        <div>
          <label class="field">Значение</label>
          <input type="number" id="customValue" placeholder="${draft && draft.type === "fixed" ? "Введите сумму" : "Введите процент"}" inputmode="decimal" value="${draft ? draft.val : ""}">
        </div>
      </div>
      <div style="height:10px;"></div>
      <button class="btn" id="addCustomBtn">＋ Добавить категорию</button>
      <div style="height:14px;"></div>
      <h2 style="margin-top:14px;">Мои категории</h2>
      ${customRows}
    </div>

    <div class="card">
      <h2>Резервная копия</h2>
      <div class="section-note">Все данные хранятся только в этом браузере. Экспорт сохраняет ВСЁ: категории, историю доходов и настройки — для переноса на новое устройство.</div>
      <div class="add-income">
        <button class="btn" id="exportBtn">⬇ Экспорт JSON</button>
        <button class="btn secondary" id="importBtn">⬆ Импорт JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
      <div id="importStatus" class="lock-note" style="margin-top:8px;"></div>
    </div>
  `;
}

function ruDate(iso){
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return `${d.getDate()} ${MONTHS_RU[d.getMonth()]} ${d.getFullYear()}`;
}

function buildDolgrosok(){
  // помесячные данные 2027–2041
  const years = [];
  for(let y = 2027; y <= 2041; y++){
    const rows = [];
    for(let m = 1; m <= 12; m++){
      const IIS = y <= 2036 ? 27350 : 33350;
      const PDS = y <= 2036 ? 6000 : 0;
      const help = (y>=2028 && y<=2037 && m===8) ? 36000 : 0;      // софинансирование за прошлый год — в августе
      const vychet = (y>=2028 && y<=2041 && m===4) ? 52000 : 0;    // возврат НДФЛ — в апреле
      let note = "";
      if(m===12 && y<=2041) note = ">>> 20 декабря: сверить, что взносы ИИС+ПДС за год = 400 000 ₽";
      if(y===2028 && m===4) note = "Возврат НДФЛ за 2027 г. (13% от 400 000 ₽)";
      else if(y>2028 && m===4) note = `Возврат НДФЛ за ${y-1} г. (13% от 400 000 ₽)`;
      if(m===8 && help) note = `Софинансирование за ${y-1} г. (взнос 72 000 ₽ × коэф. 1:2)`;
      rows.push({y, m, IIS, PDS, help, vychet, note});
    }
    years.push({ y, rows });
  }

  return years.map(yr => {
    const yrSum = {
      IIS: yr.rows.reduce((s,r)=>s+r.IIS,0),
      PDS: yr.rows.reduce((s,r)=>s+r.PDS,0),
      help: yr.rows.reduce((s,r)=>s+r.help,0),
      vychet: yr.rows.reduce((s,r)=>s+r.vychet,0),
    };
    const rowsHTML = yr.rows.map(r => `
      <div class="lg-grid">
        <div class="rv">${MONTHS_RU[r.m-1].slice(0,3)}</div>
        <div class="rv p">${r.PDS ? fmt(r.PDS) : "—"}</div>
        <div class="rv i">${r.help ? fmt(r.help) : "—"}</div>
        <div class="rv i">${fmt(r.IIS)}</div>
        <div class="rv ${r.vychet?'pos':''}">${r.vychet ? fmt(r.vychet) : "—"}</div>
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      </div>`).join("");
    return `
      <div class="card">
        <div class="year-head" data-year-toggle>
          <span>${yr.y}</span>
          <span class="sum">ИИС ${fmt(yrSum.IIS)} · ПДС ${fmt(yrSum.PDS)}${yrSum.help?` · гос ${fmt(yrSum.help)}`:""}</span>
        </div>
        <div class="lg-grid">
          <div class="hd">Месяц</div><div class="hd">ПДС</div><div class="hd">Гос</div><div class="hd">ИИС</div><div class="hd">Вычет</div>
        </div>
        <div class="year-body hidden">${rowsHTML}</div>
      </div>`;
  }).join("");
}

/* ---------- бегущая строка ---------- */
function setupMarquees(root){
  root.querySelectorAll(".marquee").forEach(el=>{
    const track = el.querySelector(".marquee-track");
    const first = track.querySelector("span");
    el.classList.remove("scrolling"); el.classList.add("static");
    track.style.animationDuration = "";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const overflow = first.scrollWidth > el.clientWidth + 1;
      if(overflow){
        el.classList.remove("static"); el.classList.add("scrolling");
        const dist = first.scrollWidth + 28;
        const duration = Math.max(6, dist/40);
        track.style.animationDuration = duration + "s";
      }
    }));
  });
}

function bindEvents(){
  // --- Выбор месяца/года на главной (временный, не сохраняется в LocalStorage) ---
  document.getElementById("selMonth")?.addEventListener("change", e=>{
    selMonth = parseInt(e.target.value, 10) || null;
    render();
  });
  document.getElementById("selYear")?.addEventListener("change", e=>{
    selYear = parseInt(e.target.value, 10) || null;
    render();
  });

  // --- Перейти к добавлению дохода ---
  document.getElementById("goAddIncome")?.addEventListener("click", ()=>{
    setActiveView("incomes");
    setTimeout(()=>document.getElementById("newAmount")?.focus(), 50);
  });

  // --- Доходы: добавление ---
  document.getElementById("addIncomeBtn")?.addEventListener("click", ()=>{
    const date = document.getElementById("newDate").value;
    const amount = parseFloat(document.getElementById("newAmount").value);
    const comment = document.getElementById("newComment").value.trim();
    if(!date || isNaN(amount)) return;
    state.incomes.push({date, amount, comment});
    save();
  });
  document.querySelectorAll("[data-del-income]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.incomes.splice(parseInt(el.dataset.delIncome,10),1);
      save();
    });
  });

  // --- Настройки: закрыть предупреждение о долгах (больше не показывается) ---
  document.querySelector("[data-close-debt]")?.addEventListener("click", ()=>{
    state.hideDebtNotice = true;
    save();
  });

  // --- Настройки: переключение тип/значение категории ---
  document.querySelectorAll("[data-seg]").forEach(seg=>{
    seg.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const uid = seg.dataset.seg;
        const kind = btn.dataset.segKind;
        const hit = findNode(state.tree, uid);
        if(!hit) return;
        const nd = hit.node;
        // при переключении типа берём текущее «значение» за основу
        if(kind === "pct" && nd.kind !== "pct"){
          const newVal = nd.pctOfSalary || 1;
          const parent = findParentOf(state.tree, uid);
          const room = parent ? pctHeadroom(parent, uid) : 100;
          if(newVal > room + 1e-9){
            guardMsg = `Нельзя: сумма процентов уровня превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
            render(); return;
          }
          nd.kind = "pct"; nd.value = newVal;
        }
        if(kind === "fixed" && nd.kind !== "fixed"){ nd.kind = "fixed"; nd.value = nd.amount || 0; }
        save();
      });
    });
  });

  // --- Настройки: изменение значения ---
  document.querySelectorAll("[data-set-value]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const uid = inp.dataset.setValue;
      const hit = findNode(state.tree, uid);
      if(!hit) return;
      const v = parseFloat(inp.value);
      const val = isNaN(v)?0:Math.max(0,v);
      if(inp.dataset.kind === "pct"){
        const room = pctHeadroom(findParentOf(state.tree, uid) || state.tree, uid);
        if(val > room + 1e-9){
          guardMsg = `Нельзя: сумма процентов уровня превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
          render(); return;
        }
        hit.node.kind = "pct"; hit.node.value = val;
      } else { hit.node.kind = "fixed"; hit.node.value = val; }
      save();
    });
  });

  // --- Настройки: добавление пользовательской категории ---
  // Плейсхолдер поля «Значение» зависит от выбранного типа
  document.getElementById("customType")?.addEventListener("change", e=>{
    const v = document.getElementById("customValue");
    if(v) v.placeholder = e.target.value === "fixed" ? "Введите сумму" : "Введите процент";
  });
  document.getElementById("addCustomBtn")?.addEventListener("click", ()=>{
    const name = document.getElementById("customName").value.trim();
    const levelId = document.getElementById("customLevel").value;
    const type = document.getElementById("customType").value;
    const val = parseFloat(document.getElementById("customValue").value);
    if(!name || isNaN(val)) return;
    const { parent } = containerByLevel(levelId);
    if(type === "pct"){
      const room = pctHeadroom(parent, null);
      if(val > room + 1e-9){
        guardMsg = `Нельзя: сумма процентов уровня превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
        customDraft = { name, level: levelId, type, val: Math.max(0, val) };
        render(); return;
      }
    }
    parent.children = parent.children || [];
    parent.children.push({ uid: freshUid(), kind: type==="pct"?"pct":"fixed", value: Math.max(0,val), name, custom: true });
    save();
  });

  // --- Настройки: удаление пользовательской категории ---
  document.querySelectorAll("[data-del-custom]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const uid = el.dataset.delCustom;
      const parent = findParentOf(state.tree, uid);
      if(!parent) return;
      parent.children = parent.children.filter(c=>c.uid !== uid);
      save();
    });
  });

  // --- Настройки: смена уровня пользовательской категории ---
  document.querySelectorAll("[data-custom-level]").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const uid = sel.dataset.customLevel;
      const levelId = sel.value;
      const parent = findParentOf(state.tree, uid);
      if(!parent) return;
      const idx = parent.children.findIndex(c=>c.uid === uid);
      const nd = parent.children[idx];
      const { parent: newParent } = containerByLevel(levelId);
      if(nd.kind === "pct" && newParent !== parent){
        const room = pctHeadroom(newParent, uid);
        if(n2(nd.value) > room + 1e-9){
          guardMsg = `Нельзя: на этом уровне сумма процентов превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
          render(); return;
        }
      }
      parent.children.splice(idx,1);
      newParent.children = newParent.children || [];
      newParent.children.push(nd);
      save();
    });
  });

  // --- Настройки: переименование категории ---
  document.querySelectorAll("[data-edit-name]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uid = btn.dataset.editName;
      const hit = findNode(state.tree, uid);
      if(!hit) return;
      const nameTxt = btn.parentElement.querySelector(".marquee");
      if(!nameTxt) return;
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "cat-name-inp";
      inp.value = hit.node.name;
      nameTxt.replaceWith(inp);
      btn.remove();
      inp.focus();
      inp.select();
      const onDone = (commit)=>{
        const v = (inp.value||"").trim();
        if(commit && v && v !== hit.node.name){ hit.node.name = v; save(); }
        else { render(); }
      };
      inp.addEventListener("blur", ()=>onDone(true));
      inp.addEventListener("keydown", (e)=>{
        if(e.key === "Enter"){ inp.blur(); }
        if(e.key === "Escape"){ e.preventDefault(); onDone(false); }
      });
    });
  });

  // --- Настройки: экспорт / импорт ---
  document.getElementById("exportBtn")?.addEventListener("click", ()=>{
    const dataStr = JSON.stringify(snapState(), null, 2);
    const blob = new Blob([dataStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `budget-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  document.getElementById("importBtn")?.addEventListener("click", ()=>{
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile")?.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    const statusEl = document.getElementById("importStatus");
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !parsed.tree || !parsed.tree.kind){
          throw new Error("Похоже, это не файл резервной копии этого приложения.");
        }
        state = Object.assign(defaultState(), parsed);
        migrateTree(state.tree);
        if(!state.salary) state.salary = 0;
        save();
        if(statusEl) statusEl.textContent = "✓ Данные восстановлены из файла — идеальная копия состояния.";
      }catch(err){
        if(statusEl){ statusEl.textContent = "⚠ Не удалось импортировать: " + err.message; }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // --- Информация: сворачивание лет в долгосроке ---
  document.querySelectorAll("[data-year-toggle]").forEach(h=>{
    h.addEventListener("click", ()=>{
      const body = h.parentElement.querySelector(".year-body");
      body.classList.toggle("hidden");
    });
  });

  // --- Информация: отметки «Сделано» в календаре ---
  document.querySelectorAll("[data-cal-check]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      state.calCheck[cb.dataset.calCheck] = cb.checked ? true : false;
      save();
    });
  });
}

/* ---------- навигация по табам ---------- */
document.querySelectorAll("nav.tabbar button").forEach(btn=>{
  btn.addEventListener("click", ()=> setActiveView(btn.dataset.view));
});

window.addEventListener("resize", ()=>{
  const view = document.querySelector("main .view.active");
  if(view) setupMarquees(view);
  if(activeView === "home") drawChart();
});

document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && activeView === "home") drawChart();
});

/* ================= PWA: установка + Service Worker ================= */
let deferredPrompt = null;
const A2HS_KEY = "budget_a2hs_dismissed";

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!localStorage.getItem(A2HS_KEY)) showA2hs();
});
function showA2hs(){ document.getElementById("a2hs").classList.remove("hidden"); }
function hideA2hs(){ document.getElementById("a2hs").classList.add("hidden"); }

document.getElementById("a2hsInstall").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});
document.getElementById("a2hsClose").addEventListener("click", ()=>{
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});

window.addEventListener("appinstalled", ()=>{
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});

// регистрация Service Worker
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

/* ---------- стиль для скрытых элементов ---------- */
const style = document.createElement("style");
style.textContent = ".hidden{display:none !important;}";
document.head.appendChild(style);

/* ---------- старт ---------- */
render();
</script>
