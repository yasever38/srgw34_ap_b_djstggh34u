    render();
  });
  document.getElementById("selIncomeEntry")?.addEventListener("change", e=>{
    selIncomeChoice = e.target.value;
    render();
  });

  // --- Перейти к добавлению дохода ---
  document.getElementById("goAddIncome")?.addEventListener("click", ()=>{
    setActiveView("incomes");
    setTimeout(()=>document.getElementById("newAmount")?.focus(), 50);
  });

  // --- Доходы: добавление ---
  document.getElementById("addIncomeBtn")?.addEventListener("click", ()=>{
    const date = document.getElementById("newDate").value;
    const rawAmount = parseFloat(document.getElementById("newAmount").value);
    const comment = document.getElementById("newComment").value.trim();
    if(!date || isNaN(rawAmount)) return;
    const amount = Math.max(0, rawAmount); // отрицательный доход не имеет смысла — как и другие суммы в приложении, не даём уйти в минус
    state.incomes.push({id: freshUid(), date, amount, comment});
    save();
  });
  document.querySelectorAll("[data-del-income]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.incomes.splice(parseInt(el.dataset.delIncome,10),1);
      save();
    });
  });

  // --- Настройки: закрыть предупреждение о долгах (больше не показывается) ---
  document.querySelector("[data-close-debt]")?.addEventListener("click", ()=>{
    state.hideDebtNotice = true;
    save();
  });

  // --- Настройки: категории-исключения (расчёт % от каждого пополнения отдельно) ---
  document.querySelectorAll("[data-exc-seg]").forEach(seg=>{
    seg.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const uid = seg.dataset.excSeg;
        const hit = findNode(state.tree, uid);
        if(!hit) return;
        hit.node.baseException = btn.dataset.excVal === "1";
        save();
      });
    });
  });

  // --- Настройки: переключение тип/значение категории ---
  document.querySelectorAll("[data-seg]").forEach(seg=>{
    seg.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const uid = seg.dataset.seg;
        const kind = btn.dataset.segKind;
        const hit = findNode(state.tree, uid);
        if(!hit) return;
        const nd = hit.node;
        // при переключении типа берём текущее «значение» за основу
        if(kind === "pct" && nd.kind !== "pct"){
          const newVal = nd.pctOfSalary || 1;
          const parent = findParentOf(state.tree, uid);
          const room = parent ? pctHeadroom(parent, uid) : 100;
          if(newVal > room + 1e-9){
            guardMsg = `Нельзя: сумма процентов уровня превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
            render(); return;
          }
          nd.kind = "pct"; nd.value = newVal;
        }
        if(kind === "fixed" && nd.kind !== "fixed"){ nd.kind = "fixed"; nd.value = nd.amount || 0; }
        save();
      });
    });
  });

  // --- Настройки: изменение значения ---
  document.querySelectorAll("[data-set-value]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const uid = inp.dataset.setValue;
      const hit = findNode(state.tree, uid);
      if(!hit) return;
      const v = parseFloat(inp.value);
      const val = isNaN(v)?0:Math.max(0,v);
      if(inp.dataset.kind === "pct"){
        const room = pctHeadroom(findParentOf(state.tree, uid) || state.tree, uid);
        if(val > room + 1e-9){
          guardMsg = `Нельзя: сумма процентов уровня превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
          render(); return;
        }
        hit.node.kind = "pct"; hit.node.value = val;
      } else { hit.node.kind = "fixed"; hit.node.value = val; }
      save();
    });
  });

  // --- Настройки: добавление пользовательской категории ---
  // Плейсхолдер поля «Значение» зависит от выбранного типа
  document.getElementById("customType")?.addEventListener("change", e=>{
    const v = document.getElementById("customValue");
    if(v) v.placeholder = e.target.value === "fixed" ? "Введите сумму" : "Введите процент";
  });
  document.getElementById("addCustomBtn")?.addEventListener("click", ()=>{
    const name = document.getElementById("customName").value.trim();
    const levelId = document.getElementById("customLevel").value;
    const type = document.getElementById("customType").value;
    const val = parseFloat(document.getElementById("customValue").value);
    if(!name || isNaN(val)) return;
    const { parent } = containerByLevel(levelId);
    if(type === "pct"){
      const room = pctHeadroom(parent, null);
      if(val > room + 1e-9){
        guardMsg = `Нельзя: сумма процентов уровня превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
        customDraft = { name, level: levelId, type, val: Math.max(0, val) };
        render(); return;
      }
    }
    insertCategoryChild(parent, { uid: freshUid(), kind: type==="pct"?"pct":"fixed", value: Math.max(0,val), name, custom: true, baseException: false });
    save();
  });

  // --- Настройки: удаление пользовательской категории ---
  document.querySelectorAll("[data-del-custom]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const uid = el.dataset.delCustom;
      const parent = findParentOf(state.tree, uid);
      if(!parent) return;
      parent.children = parent.children.filter(c=>c.uid !== uid);
      save();
    });
  });

  // --- Настройки: смена уровня пользовательской категории ---
  document.querySelectorAll("[data-custom-level]").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const uid = sel.dataset.customLevel;
      const levelId = sel.value;
      const parent = findParentOf(state.tree, uid);
      if(!parent) return;
      const idx = parent.children.findIndex(c=>c.uid === uid);
      const nd = parent.children[idx];
      const { parent: newParent } = containerByLevel(levelId);
      if(nd.kind === "pct" && newParent !== parent){
        const room = pctHeadroom(newParent, uid);
        if(n2(nd.value) > room + 1e-9){
          guardMsg = `Нельзя: на этом уровне сумма процентов превысит 100%. Доступно ещё ${room.toFixed(1)}%.`;
          render(); return;
        }
      }
      parent.children.splice(idx,1);
      insertCategoryChild(newParent, nd);
      save();
    });
  });

  // --- Настройки: переименование категории ---
  document.querySelectorAll("[data-edit-name]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uid = btn.dataset.editName;
      const hit = findNode(state.tree, uid);
      if(!hit) return;
      const nameTxt = btn.parentElement.querySelector(".marquee");
      if(!nameTxt) return;
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "cat-name-inp";
      inp.value = hit.node.name;
      nameTxt.replaceWith(inp);
      btn.remove();
      inp.focus();
      inp.select();
      const onDone = (commit)=>{
        const v = (inp.value||"").trim();
        if(commit && v && v !== hit.node.name){ hit.node.name = v; save(); }
        else { render(); }
      };
      inp.addEventListener("blur", ()=>onDone(true));
      inp.addEventListener("keydown", (e)=>{
        if(e.key === "Enter"){ inp.blur(); }
        if(e.key === "Escape"){ e.preventDefault(); onDone(false); }
      });
    });
  });

  // --- Настройки: экспорт / импорт ---
  document.getElementById("exportBtn")?.addEventListener("click", ()=>{
    const dataStr = JSON.stringify(snapState(), null, 2);
    const blob = new Blob([dataStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `budget-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  document.getElementById("importBtn")?.addEventListener("click", ()=>{
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile")?.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      // #importStatus запрашиваем заново в каждой ветке: save() ниже
      // пересобирает DOM, старая ссылка на элемент станет «висячей».
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !parsed.tree || !parsed.tree.kind){
          throw new Error("Похоже, это не файл резервной копии этого приложения.");
        }
        state = Object.assign(defaultState(), parsed);
        migrateTree(state.tree);
        migrateIncomes(state.incomes);
        const fixedCount = sanitizeValues(state);
        if(!state.salary) state.salary = 0;
        selIncomeChoice = null;
        save();
        const statusEl = document.getElementById("importStatus");
        if(statusEl){
          statusEl.textContent = fixedCount > 0
            ? `⚠ Импортировано, но ${fixedCount} ${fixedCount===1?"значение было отрицательным":"значения/значений были отрицательными"} — приведено к 0. Если это не ожидалось (например, опечатка при ручной правке файла), проверьте исходный JSON.`
            : "✓ Данные восстановлены из файла — идеальная копия состояния.";
        }
      }catch(err){
        const statusEl = document.getElementById("importStatus");
        if(statusEl){ statusEl.textContent = "⚠ Не удалось импортировать: " + err.message; }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // --- Информация: сворачивание лет в долгосроке ---
  document.querySelectorAll("[data-year-toggle]").forEach(h=>{
    h.addEventListener("click", ()=>{
      const body = h.parentElement.querySelector(".year-body");
      body.classList.toggle("hidden");
    });
  });

  // --- Информация: отметки «Сделано» в календаре ---
  document.querySelectorAll("[data-cal-check]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      state.calCheck[cb.dataset.calCheck] = cb.checked ? true : false;
      save();
    });
  });
}

/* ---------- навигация по табам ---------- */
document.querySelectorAll("nav.tabbar button").forEach(btn=>{
  btn.addEventListener("click", ()=> setActiveView(btn.dataset.view));
});

window.addEventListener("resize", ()=>{
  const view = document.querySelector("main .view.active");
  if(view) setupMarquees(view);
  if(activeView === "home") drawChart();
});

document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && activeView === "home") drawChart();
});

/* ================= PWA: установка + Service Worker ================= */
let deferredPrompt = null;
const A2HS_KEY = "budget_a2hs_dismissed";

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!localStorage.getItem(A2HS_KEY)) showA2hs();
});
function showA2hs(){ document.getElementById("a2hs").classList.remove("hidden"); }
function hideA2hs(){ document.getElementById("a2hs").classList.add("hidden"); }

document.getElementById("a2hsInstall").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});
document.getElementById("a2hsClose").addEventListener("click", ()=>{
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});

window.addEventListener("appinstalled", ()=>{
  hideA2hs();
  localStorage.setItem(A2HS_KEY, "1");
});

// регистрация Service Worker
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

/* ---------- стиль для скрытых элементов ---------- */
const style = document.createElement("style");
style.textContent = ".hidden{display:none !important;}";
document.head.appendChild(style);

/* ---------- старт ---------- */
render();
</script>
</body>
